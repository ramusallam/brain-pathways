function drawConceptSynapse(ctx, cx, cy, progress, t) {
  ctx.save();
  // pre-terminal
  const preGrad = ctx.createRadialGradient(cx - 200, cy - 50, 10, cx - 200, cy, 200);
  preGrad.addColorStop(0, '#f8d9ce');
  preGrad.addColorStop(0.6, '#d49a8d');
  preGrad.addColorStop(1, '#a86456');
  ctx.fillStyle = preGrad;
  ctx.beginPath();
  ctx.ellipse(cx - 180, cy, 130, 110, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = 'rgba(140, 75, 60, 0.5)';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  // post-dendrite
  const postGrad = ctx.createRadialGradient(cx + 200, cy - 50, 10, cx + 200, cy, 200);
  postGrad.addColorStop(0, '#d4c0ee');
  postGrad.addColorStop(0.6, '#9a7fc0');
  postGrad.addColorStop(1, '#705396');
  ctx.fillStyle = postGrad;
  ctx.beginPath();
  ctx.ellipse(cx + 180, cy, 130, 110, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = 'rgba(80, 60, 110, 0.5)';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  // cleft gap
  ctx.strokeStyle = 'rgba(255,255,255,0.15)';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(cx - 50, cy - 100);
  ctx.lineTo(cx - 50, cy + 100);
  ctx.moveTo(cx + 50, cy - 100);
  ctx.lineTo(cx + 50, cy + 100);
  ctx.stroke();
  // NTs floating in cleft
  for (let i = 0; i < 10; i++) {
    const px = cx - 40 + (i / 9) * 80 + Math.sin(t / 300 + i) * 5;
    const py = cy - 80 + (i % 4) * 50 + Math.sin(t / 500 + i * 1.3) * 5;
    const flow = Math.min(1, progress * 2);
    const xpos = lerp(cx - 70, px, flow);
    const cg = ctx.createRadialGradient(xpos - 1, py - 1, 0, xpos, py, 8);
    cg.addColorStop(0, 'rgba(255,255,255,0.95)');
    cg.addColorStop(0.35, '#f472b6');
    cg.addColorStop(1, '#a02868');
    ctx.fillStyle = cg;
    ctx.beginPath();
    ctx.arc(xpos, py, 7, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function pickNode(x, y) {
  // sort by radius ascending so small deep structures get clicked
  // over the larger cortex blobs they sit inside
  const all = [...Object.keys(REGIONS), ...Object.keys(INPUTS), ...Object.keys(OUTPUTS)];
  all.sort((a, b) => getNode(a).r - getNode(b).r);
  for (const k of all) {
    const n = getNode(k);
    const dx = x - n.x, dy = y - n.y;
    if (Math.hypot(dx, dy) <= n.r + 6) return k;
  }
  return null;
}

function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
  const words = text.split(' ');
  let line = '';
  let yy = y;
  for (let i = 0; i < words.length; i++) {
    const test = line + words[i] + ' ';
    const m = ctx.measureText(test);
    if (m.width > maxWidth && i > 0) {
      ctx.fillText(line, x, yy);
      line = words[i] + ' ';
      yy += lineHeight;
    } else {
      line = test;
    }
  }
  ctx.fillText(line, x, yy);
}

// =====================================================
//  Pathway tracer — animates a sequence of node keys with glowing pulses
// =====================================================
function tracePathway(ctx, nodes, t, opts = {}) {
  if (!nodes || nodes.length < 2) return null;
  const speed = opts.speed || 0.0006;
  const loop = opts.loop !== false;
  const color = opts.color || '#ffd166';
  // Compute progress through whole sequence
  const segCount = nodes.length - 1;
  const totalT = (t * speed) % (loop ? 1 : Infinity);
  const segProgress = totalT * segCount;
  const currentSeg = Math.floor(segProgress);
  const inSegT = segProgress - currentSeg;

  // Draw all segments with activation level
  for (let i = 0; i < segCount; i++) {
    let activation;
    if (i < currentSeg) activation = 0.9; // already fired
    else if (i === currentSeg) activation = 0.4 + inSegT * 0.5;
    else activation = 0.15;
    drawPathwaySegment(ctx, nodes[i], nodes[i+1], { color, active: activation });
  }

  // Draw current pulse position
  if (currentSeg < segCount) {
    const a = getNode(nodes[currentSeg]);
    const b = getNode(nodes[currentSeg + 1]);
    if (a && b) {
      drawSignalPulse(ctx, nodes[currentSeg], nodes[currentSeg + 1], inSegT, { color });
    }
  }

  return { currentSeg, inSegT };
}

// Compute which nodes are "lit" based on pathway progress
function getActivationMap(nodes, traceState) {
  const map = {};
  if (!traceState) return map;
  for (let i = 0; i <= traceState.currentSeg && i < nodes.length; i++) {
    map[nodes[i]] = 1;
  }
  if (traceState.currentSeg + 1 < nodes.length) {
    map[nodes[traceState.currentSeg + 1]] = traceState.inSegT;
  }
  return map;
}

// Draw all nodes (regions/inputs/outputs) with activation from a map.
// Also draws persistent labels on every brain region.
function drawAllNodes(ctx, t, activationMap, dimUnlit) {
  Object.keys(REGIONS).forEach(k => {
    const a = activationMap[k] || 0;
    drawRegion(ctx, k, { t, active: a, dim: dimUnlit && a < 0.05 ? 0.6 : 0 });
  });
  Object.keys(INPUTS).forEach(k => {
    const a = activationMap[k] || 0;
    drawInput(ctx, k, { t, active: a });
  });
  Object.keys(OUTPUTS).forEach(k => {
    const a = activationMap[k] || 0;
    drawOutput(ctx, k, { t, active: a });
  });
  // Persistent labels on every brain region — active ones get bolder
  drawAllLabels(ctx, activationMap);
}

function drawAnimatedSequence(ctx, nodes, progress, color, t) {
  if (!nodes || nodes.length < 2) return;
  const segCount = nodes.length - 1;
  const segProgress = progress * segCount;
  const currentSeg = Math.floor(Math.min(segProgress, segCount - 0.0001));
  const inSegT = segProgress - currentSeg;
  // segments
  for (let i = 0; i < segCount; i++) {
    let a;
    if (i < currentSeg) a = 0.9;
    else if (i === currentSeg) a = 0.5 + inSegT * 0.4;
    else a = 0.18;

  }
  if (currentSeg < segCount && progress < 1) {
    drawSignalPulse(ctx, nodes[currentSeg], nodes[currentSeg+1], inSegT, { color });
  }
}

function drawEyeDiagram(ctx, x, y, t) {
  ctx.save();
  // ambient glow
  const halo = ctx.createRadialGradient(x + 60, y + 30, 0, x + 60, y + 30, 110);
  halo.addColorStop(0, rgba(C.occipital, 0.15));
  halo.addColorStop(1, rgba(C.occipital, 0));
  ctx.fillStyle = halo;
  ctx.beginPath(); ctx.arc(x + 60, y + 30, 110, 0, Math.PI * 2); ctx.fill();
  // eyeball
  const eyeGrad = ctx.createRadialGradient(x + 55, y + 20, 5, x + 60, y + 30, 60);
  eyeGrad.addColorStop(0, '#ffffff');
  eyeGrad.addColorStop(0.7, '#e0e7ff');
  eyeGrad.addColorStop(1, '#a5b4fc');
  ctx.fillStyle = eyeGrad;
  ctx.beginPath();
  ctx.ellipse(x + 60, y + 30, 55, 40, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = 'rgba(165, 180, 252, 0.6)';
  ctx.lineWidth = 1.3;
  ctx.stroke();
  // iris
  const irisGrad = ctx.createRadialGradient(x + 25, y + 26, 0, x + 25, y + 30, 18);
  irisGrad.addColorStop(0, '#c4b5fd');
  irisGrad.addColorStop(1, '#4338ca');
  ctx.fillStyle = irisGrad;
  ctx.beginPath();
  ctx.arc(x + 25, y + 30, 18, 0, Math.PI * 2);
  ctx.fill();
  // pupil
  ctx.fillStyle = '#0a0a0a';
  ctx.beginPath();
  ctx.arc(x + 25, y + 30, 8, 0, Math.PI * 2);
  ctx.fill();
  // light ray entering
  const rayProgress = ((t / 1500) % 1);
  ctx.strokeStyle = rgba('#ffd166', 0.85);
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  ctx.shadowBlur = 16;
  ctx.shadowColor = 'rgba(255, 209, 102, 0.7)';
  ctx.beginPath();
  ctx.moveTo(x - 10, y + 30);
  ctx.lineTo(x + 25 + rayProgress * 35, y + 30);
  ctx.stroke();
  ctx.shadowBlur = 0;
  // retina (back of eye)
  ctx.strokeStyle = rgba(C.occipital, 0.85);
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(x + 60, y + 30, 42, -Math.PI * 0.35, Math.PI * 0.35);
  ctx.stroke();
  // optic nerve exit
  ctx.strokeStyle = rgba(C.occipital, 0.6);
  ctx.lineWidth = 6;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x + 105, y + 30);
  ctx.quadraticCurveTo(x + 140, y + 50, INPUTS.eye.x - 15, INPUTS.eye.y);
  ctx.stroke();
  // labels
  ctx.font = '600 11px -apple-system, system-ui';
  ctx.fillStyle = '#a0a0a0';
  ctx.textAlign = 'center';
  ctx.fillText('cornea + lens', x + 25, y - 6);
  ctx.fillText('retina', x + 90, y + 78);
  ctx.fillText('optic nerve', x + 130, y - 6);
  ctx.restore();
}

  pathwayKey: "Cue (notification / drug / image) <span class='arrow'>→</span> Sensory input <span class='arrow'>→</span> Nucleus accumbens (BIG dopamine) <span class='arrow'>→</span> Hippocampus (cue memory) + Amygdala (urgency) + Hypothalamus (craving) <span class='arrow'>→</span> Frontal lobe inhibition challenged",
  setup() {

    sceneLocal = {

  const keyEl = document.getElementById('pathwayKey');

    keyEl.classList.remove('hidden');

function checkPathway(built, correct) {
  if (built.length === 0) return { ok: false, msg: 'Start by clicking the sensory input that detects the stimulus.' };
  // Check sensory start
  if (!INPUTS[built[0]] && !REGIONS[built[0]]) {
    // sensor missing
  }
  // exact match
  if (arrEq(built, correct)) {
    const ch = CHALLENGES.find(c => arrEq(c.correct, correct));
    return { ok: true, msg: ch ? ch.success : 'Exactly right.' };
  }
  // Plausibility: starts with a sensory input, ends with an output, includes thalamus for non-smell, etc.
  const startsWithSensor = INPUTS[built[0]];
  const correctSensor = correct[0];
  if (built[0] !== correctSensor) {
    if (built[0] === 'nose' && correctSensor !== 'nose') return { ok: false, msg: 'This stimulus is not a smell. Pick a different sensory input.' };
    if (correctSensor === 'nose') return { ok: false, msg: 'This is a smell. Try starting from the nose. Remember, smell skips the thalamus.' };
    if (correctSensor === 'skin') return { ok: false, msg: 'This is a touch or pain stimulus. Start from the skin.' };
    if (correctSensor === 'ear') return { ok: false, msg: 'This is a sound. Start from the ear.' };
    if (correctSensor === 'eye') return { ok: false, msg: 'This is a visual stimulus. Start from the eye.' };
  }
  // Thalamus check
  if (correct.includes('thalamus') && !built.includes('thalamus')) {
    return { ok: false, msg: 'Most sensory information passes through the thalamus first. Add it before the cortex.' };
  }
  // Amygdala check (fear)
  if (correct.includes('amygdala') && !built.includes('amygdala')) {
    return { ok: false, msg: 'This pathway involves emotion or fear. Try adding the amygdala.' };
  }
  // Hippocampus check (memory)
  if (correct.includes('hippocampus') && !built.includes('hippocampus')) {
    return { ok: false, msg: 'This pathway involves memory. Try adding the hippocampus.' };
  }
  // Accumbens (reward)
  if (correct.includes('accumbens') && !built.includes('accumbens')) {
    return { ok: false, msg: 'Reward pathways involve the nucleus accumbens. Try adding it.' };
  }
  // Cerebellum (movement)
  if (correct.includes('cerebellum') && !built.includes('cerebellum')) {
    return { ok: false, msg: 'Balance and coordination involve the cerebellum. Try adding it.' };
  }
  // Output check
  const outputs = ['muscle','gland','motorNeuron'];
  const lastNeeded = correct[correct.length - 1];
  if (outputs.includes(lastNeeded) && !built.includes(lastNeeded)) {
    return { ok: false, msg: 'This pathway needs an output. Make sure you end with a muscle or gland response.' };
  }
  // length check
  if (built.length < correct.length - 1) {
    return { ok: false, msg: 'Your pathway is missing some steps. Think about what relays and processes the signal.' };
  }
  return { ok: false, msg: 'This is close but not the simplest plausible route. Compare your steps to the canonical pathway and try again.' };
}

function arrEq(a, b) {
  if (a.length !== b.length) return false;
  for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return false;
  return true;
}

// =====================================================
//  SCENE 13: Reflect & Synthesize
// =====================================================
const sceneReflect = {
  phase: 'Step 13: Reflect & Synthesize',
  phaseColor: '#c7d2fe',
  notes: "Look back at your tracker table. You traced pathways for <strong>touch, pain, hearing, smell, vision, reward, addiction, and movement</strong>. Every one followed the same overall shape but emphasized different brain regions. The brain is not one piece doing one thing — it is many regions working in <strong>parallel</strong>, and the pathway depends on the sensory modality and the kind of response needed. <strong>Each region has a specialty. They work together.</strong>",
  notebook: "<strong>Reflect in your notebook</strong>. Answer all three: <strong>(1)</strong> Which brain region surprised you the most, and why? <strong>(2)</strong> Pick one pathway you traced today and explain it in your own words from stimulus to response, naming the sensory modality and the key brain region for that pathway. <strong>(3)</strong> Connect this to what you already know: how do <strong>action potentials</strong> and <strong>synapses</strong> from the last two simulations make these whole-brain pathways possible? Write a few sentences for each.",
  setup() {
    clearField();
    sceneLocal = {
      cycleIdx: 0,
      cycleT: 0,
      pathways: [
        { name: 'Touch / Pain', color: '#fbbf24', nodes: ['skin', 'thalamus', 'parietal', 'frontal'] },
        { name: 'Hearing (Fear)', color: '#f87171', nodes: ['ear', 'thalamus', 'amygdala', 'hypothalamus', 'gland'] },
        { name: 'Smell (Memory)', color: '#f472b6', nodes: ['nose', 'hippocampus', 'temporal', 'frontal'] },
        { name: 'Vision', color: '#a78bfa', nodes: ['eye', 'thalamus', 'occipital', 'parietal', 'frontal'] },
        { name: 'Reward', color: '#fbbf24', nodes: ['eye', 'thalamus', 'accumbens', 'frontal'] },
        { name: 'Motor Coordination', color: '#4ade80', nodes: ['frontal', 'basalganglia', 'motor', 'cerebellum', 'spinal', 'motorNeuron', 'muscle'] },
      ]
    };
  },
  update(dt) {
    sceneLocal.cycleT += dt;
    if (sceneLocal.cycleT > 4500) {
      sceneLocal.cycleT = 0;
      sceneLocal.cycleIdx = (sceneLocal.cycleIdx + 1) % sceneLocal.pathways.length;
    }
  },
  draw(ctx, t) {
    drawBrainBase(ctx, {});
    const pw = sceneLocal.pathways[sceneLocal.cycleIdx];
    const progress = Math.min(1, sceneLocal.cycleT / 3200);
    drawAnimatedSequence(ctx, pw.nodes, progress, pw.color, t);
    const map = {};
    const lit = Math.floor(progress * (pw.nodes.length - 1));
    for (let i = 0; i <= lit; i++) map[pw.nodes[i]] = 1;
    drawAllNodes(ctx, t, map, true);

    // Show all 6 pathway names in a list with current one highlighted
    ctx.save();
    ctx.font = '700 13px -apple-system, system-ui';
    ctx.fillStyle = '#c7d2fe';
    ctx.textAlign = 'left';
    ctx.fillText('Cycling through every pathway you learned:', 70, 30);
    sceneLocal.pathways.forEach((p, i) => {
      const isActive = i === sceneLocal.cycleIdx;
      const y = 60 + i * 22;
      ctx.fillStyle = isActive ? p.color : 'rgba(160, 160, 160, 0.45)';
      ctx.font = isActive ? '700 12px -apple-system, system-ui' : '500 12px -apple-system, system-ui';
      ctx.fillText((isActive ? '▶ ' : '   ') + p.name, 70, y);
    });
    ctx.restore();
  }
};

// =====================================================
//  Scene list — in scaffolded teaching order:
//  Intro → Brain Map → Standard → Reflex → Fear → Memory →
//  Reward → Hijacking → Motor → Vision → Scenario Lab →
//  Challenge → Reflect
// =====================================================
const scenes = [
  sceneIntro,
  sceneBrainMap,
  sceneUniversalPathway,
  sceneReflex,
  sceneFear,
  sceneSmellMemory,
  sceneReward,
  sceneHijack,
  sceneMovement,
  sceneVision,
  sceneScenarioLab,
  sceneChallenge,
  sceneReflect,
];

// =====================================================
//  UI wiring
// =====================================================
const phaseNameEl = document.getElementById('phaseName');
const notesEl = document.getElementById('notes');
const stepHeadingEl = document.getElementById('stepHeading');
const notebookTextEl = document.getElementById('notebookText');
const stepIndicator = document.getElementById('stepIndicator');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const resetBtn = document.getElementById('resetBtn');
const simControlsEl = document.getElementById('simControls');
const pathwayKeyEl = document.getElementById('pathwayKey');

function pad2(n) { return n < 10 ? '0' + n : '' + n; }

// Next button is gated by the scene's canAdvance() if defined.
// Scenes with internal sub-phases (e.g. the intro) use this to hold
// the student until they've stepped through every sub-phase.
function refreshNextButton() {
  if (currentSceneIdx === scenes.length - 1) {
    nextBtn.disabled = true;
    nextBtn.title = '';
    return;
  }
  const s = scenes[currentSceneIdx];
  if (s.canAdvance && !s.canAdvance()) {
    nextBtn.disabled = true;
    nextBtn.title = 'Finish the sub-phases in this step before moving on';
  } else {
    nextBtn.disabled = false;
    nextBtn.title = '';
  }
}

function setScene(i) {
  currentSceneIdx = i;
  animT = 0;
  sceneFadeT = 0;
  const s = scenes[i];
  if (s.setup) s.setup();
  phaseNameEl.textContent = s.phase;
  phaseNameEl.style.color = s.phaseColor;
  notesEl.innerHTML = s.notes;
  stepHeadingEl.textContent = s.phase;
  notebookTextEl.innerHTML = s.notebook;
  stepIndicator.textContent = `${pad2(i + 1)} / ${pad2(scenes.length)}`;
  prevBtn.disabled = i === 0;
  nextBtn.textContent = i === scenes.length - 1 ? 'Done' : 'Next →';
  refreshNextButton();

  // Pathway key reveal (controlled per scene or by Scenario Lab)
  if (s.pathwayKey) {
    pathwayKeyEl.innerHTML = '<strong>Pathway:</strong> ' + s.pathwayKey;
    pathwayKeyEl.classList.remove('hidden');
  } else {
    pathwayKeyEl.classList.add('hidden');
  }

  // Sim controls
  simControlsEl.innerHTML = '';
  if (s.controlsHTML) {
    simControlsEl.innerHTML = s.controlsHTML;
    simControlsEl.classList.add('visible');
    if (s.bindControls) s.bindControls();
  } else {
    simControlsEl.classList.remove('visible');
  }

  // Cursor for interactive scenes
  if (s.onMouseMove || s.onClick) canvas.classList.add('interactive');
  else canvas.classList.remove('interactive');
}

prevBtn.addEventListener('click', () => { if (currentSceneIdx > 0) setScene(currentSceneIdx - 1); });
nextBtn.addEventListener('click', () => { if (currentSceneIdx < scenes.length - 1) setScene(currentSceneIdx + 1); });
resetBtn.addEventListener('click', () => setScene(0));
document.addEventListener('keydown', (e) => {
  if (e.target && e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'ArrowRight' && currentSceneIdx < scenes.length - 1 && !nextBtn.disabled) setScene(currentSceneIdx + 1);
  if (e.key === 'ArrowLeft' && currentSceneIdx > 0) setScene(currentSceneIdx - 1);
});

// =====================================================
//  Main loop
// =====================================================
let lastTs = null;
function tick(ts) {
  if (lastTs == null) lastTs = ts;
  const dt = Math.min(50, ts - lastTs);
  lastTs = ts;
  animT += dt;
  sceneFadeT = Math.min(1, sceneFadeT + dt / 600);
  const s = scenes[currentSceneIdx];
  if (s.update) s.update(dt);
  ctx.save();
  ctx.fillStyle = '#0a0a0a';
  ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = sceneFadeT;
  s.draw(ctx, animT);
  ctx.restore();
  requestAnimationFrame(tick);
}

setScene(0);
requestAnimationFrame(tick);
</script>
