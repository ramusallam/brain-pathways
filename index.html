<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Brain Pathways: From Stimulus to Response</title>
<style>
  :root {
    --bg-0: #0a0a0a;
    --bg-1: #141414;
    --ink-hi: #f5f5f5;
    --ink-mid: #a0a0a0;
    --ink-low: #6b7280;
    --accent: #6366f1;
    --panel: #141414;
    --panel-border: rgba(255,255,255,0.10);
    --note-bg: #fdf1c6;
    --note-ink: #2a1e08;
    /* Region semantic colors */
    --r-frontal: #ff8fa3;
    --r-motor: #ff6b6b;
    --r-parietal: #7dd3fc;
    --r-occipital: #a78bfa;
    --r-temporal: #5eead4;
    --r-thalamus: #c4b5fd;
    --r-hippocampus: #ffd166;
    --r-amygdala: #f87171;
    --r-hypothalamus: #fb923c;
    --r-accumbens: #fbbf24;
    --r-basal: #84cc16;
    --r-cerebellum: #4ade80;
    --r-brainstem: #22d3ee;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
    background: var(--bg-0);
    color: var(--ink-hi);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  header {
    padding: 14px 32px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    max-width: 1200px;
    margin: 0 auto;
  }
  header .title {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--ink-low);
  }
  .step-indicator {
    font-size: 13px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    color: var(--ink-low);
    letter-spacing: 1px;
  }
  main {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 32px 20px;
  }
  .stage {
    position: relative;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    overflow: hidden;
    box-shadow:
      0 30px 80px rgba(0,0,0,0.5),
      inset 0 1px 0 rgba(255,255,255,0.04);
  }
  canvas { display: block; width: 100%; height: auto; cursor: default; }
  canvas.interactive { cursor: pointer; }
  .phase-bar {
    padding: 16px 28px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 24px;
    align-items: center;
    border-top: 1px solid var(--panel-border);
    background: rgba(5, 8, 20, 0.4);
  }
  .phase-name {
    font-size: 23px;
    font-weight: 700;
    letter-spacing: 0.1px;
    color: var(--accent);
    transition: color 400ms ease;
  }
  .sim-controls {
    display: none;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: flex-end;
    max-width: 720px;
  }
  .sim-controls.visible { display: flex; }
  .sim-readout {
    font-size: 13px;
    color: var(--ink-mid);
    letter-spacing: 0.2px;
    padding: 6px 12px;
    border-radius: 8px;
    background: rgba(99,102,241,0.08);
    border: 1px solid rgba(99,102,241,0.25);
  }
  .sim-readout strong { color: #c7d2fe; font-variant-numeric: tabular-nums; }
  button.chip {
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.3px;
    padding: 7px 12px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.10);
    background: rgba(255,255,255,0.03);
    color: var(--ink-hi);
    cursor: pointer;
    transition: all 150ms;
  }
  button.chip:hover {
    background: rgba(255,255,255,0.07);
    border-color: rgba(255,255,255,0.20);
  }
  button.chip.active {
    background: rgba(99,102,241,0.20);
    border-color: rgba(99,102,241,0.65);
    color: #c7d2fe;
  }
  button.chip.warm {
    background: rgba(244, 114, 182, 0.08);
    border-color: rgba(244, 114, 182, 0.35);
    color: #f9a8d4;
  }
  button.chip.warm:hover { background: rgba(244, 114, 182, 0.18); }
  button.chip.cool {
    background: rgba(94, 234, 212, 0.08);
    border-color: rgba(94, 234, 212, 0.35);
    color: #99f6e4;
  }
  button.chip.cool:hover { background: rgba(94, 234, 212, 0.18); }
  .content { margin-top: 14px; }
  .notes-card {
    background: var(--note-bg);
    color: var(--note-ink);
    padding: 16px 22px 14px;
    border-radius: 12px;
    font-size: 15px;
    line-height: 1.55;
    position: relative;
    box-shadow:
      0 14px 40px rgba(255, 209, 102, 0.08),
      inset 0 0 0 1px rgba(0,0,0,0.02);
  }
  .step-heading {
    font-weight: 700;
    font-size: 16px;
    color: #7a3a00;
    margin-bottom: 4px;
    letter-spacing: 0.2px;
  }
  .notes-card p { margin: 0 0 6px; }
  .notes-card strong { font-weight: 700; color: #2a1e08; }
  .pathway-key {
    margin-top: 8px;
    padding: 8px 12px;
    background: rgba(0,0,0,0.04);
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    color: #5b3a08;
    line-height: 1.5;
    letter-spacing: 0.1px;
  }
  .pathway-key.hidden { display: none; }
  .pathway-key .arrow { color: #d4a554; margin: 0 4px; }

  .notebook-prompt {
    margin-top: 10px;
    padding: 12px 16px;
    background: linear-gradient(90deg, rgba(255, 209, 102, 0.15), rgba(244, 114, 182, 0.12));
    border: 1.5px solid rgba(255, 209, 102, 0.45);
    border-left: 5px solid #ffd166;
    border-radius: 10px;
    display: flex;
    align-items: flex-start;
    gap: 12px;
    font-size: 14px;
    line-height: 1.5;
    color: #f3d589;
  }
  .notebook-prompt .np-tag {
    flex-shrink: 0;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 2px;
    padding: 4px 9px;
    background: #ffd166;
    color: #2a1e08;
    border-radius: 5px;
    margin-top: 1px;
  }
  .notebook-prompt strong { color: #ffd166; font-weight: 700; }

  .student-notes {
    margin-top: 10px;
    background: rgba(99, 102, 241, 0.06);
    border: 1px solid rgba(99, 102, 241, 0.25);
    border-radius: 10px;
    padding: 10px 14px;
    display: none;
  }
  .student-notes.visible { display: block; }
  .student-notes .sn-header {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.5px;
    color: #c7d2fe;
    margin-bottom: 6px;
    text-transform: uppercase;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .student-notes textarea {
    width: 100%;
    min-height: 80px;
    background: rgba(0,0,0,0.30);
    border: 1px solid rgba(99,102,241,0.18);
    border-radius: 8px;
    padding: 10px 12px;
    font-family: inherit;
    font-size: 14px;
    line-height: 1.5;
    color: var(--ink-hi);
    resize: vertical;
    outline: none;
  }
  .student-notes textarea:focus { border-color: rgba(99,102,241,0.55); }
  .student-notes .sn-clear {
    font-size: 10px;
    background: none;
    border: none;
    color: var(--ink-low);
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 4px;
    letter-spacing: 1px;
  }
  .student-notes .sn-clear:hover { color: #f87171; }
  .student-notes .sn-saved {
    font-size: 10px;
    color: #4ade80;
    opacity: 0;
    transition: opacity 200ms;
    letter-spacing: 1px;
  }
  .student-notes .sn-saved.flash { opacity: 1; }

  nav {
    margin-top: 14px;
    display: flex;
    justify-content: space-between;
    gap: 12px;
  }
  button {
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.5px;
    padding: 10px 20px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.03);
    color: var(--ink-hi);
    cursor: pointer;
    transition: background 150ms, transform 50ms, border-color 150ms;
  }
  button:hover:not(:disabled) {
    background: rgba(255,255,255,0.06);
    border-color: rgba(255,255,255,0.15);
  }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: 0.3; cursor: not-allowed; }
  button.primary {
    background: linear-gradient(180deg, #6366f1 0%, #4f46e5 100%);
    color: #f5f5ff;
    border-color: rgba(99, 102, 241, 0.55);
    box-shadow: 0 6px 20px rgba(99, 102, 241, 0.25);
  }
  button.primary:hover { filter: brightness(1.08); }
  .btn-group { display: flex; gap: 10px; }
  @media (max-width: 720px) {
    .phase-bar { grid-template-columns: 1fr; }
    .sim-controls { justify-content: flex-start; }
    .phase-name { font-size: 20px; }
  }
</style>
</head>
<body>
<header>
  <div class="title">Brain Pathways: From Stimulus to Response</div>
  <div class="step-indicator" id="stepIndicator">01 / 12</div>
</header>

<main>
  <div class="stage">
    <canvas id="canvas" width="1600" height="650"></canvas>
    <div class="phase-bar">
      <div class="phase-name" id="phaseName">Step 1</div>
      <div class="sim-controls" id="simControls"></div>
    </div>
  </div>

  <div class="content">
    <div class="notes-card">
      <div class="step-heading" id="stepHeading">Step 1</div>
      <p id="notes"></p>
      <div class="pathway-key hidden" id="pathwayKey"></div>
    </div>
    <div class="notebook-prompt" id="notebookPrompt">
      <div class="np-tag">✎ NOTES</div>
      <div id="notebookText"></div>
    </div>
    <div class="student-notes" id="studentNotes">
      <div class="sn-header">
        <span>Your Notes <span class="sn-saved" id="snSaved">SAVED</span></span>
        <button class="sn-clear" id="snClear">CLEAR</button>
      </div>
      <textarea id="snTextarea" placeholder="Type your observations, predictions, or questions here. Saved to this browser automatically."></textarea>
    </div>
  </div>

  <nav>
    <button id="resetBtn">Start Over</button>
    <div class="btn-group">
      <button id="prevBtn">← Back</button>
      <button id="nextBtn" class="primary">Next →</button>
    </div>
  </nav>
</main>

<script>
// =====================================================
//  Canvas setup
// =====================================================
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const W = canvas.width;   // 1600
const H = canvas.height;  // 650

// =====================================================
//  Color tokens
// =====================================================
const C = {
  accent: '#6366f1',
  frontal: '#ff8fa3',
  motor: '#ff6b6b',
  parietal: '#7dd3fc',
  occipital: '#a78bfa',
  temporal: '#5eead4',
  thalamus: '#c4b5fd',
  hippocampus: '#ffd166',
  amygdala: '#f87171',
  hypothalamus: '#fb923c',
  accumbens: '#fbbf24',
  basal: '#84cc16',
  cerebellum: '#4ade80',
  brainstem: '#22d3ee',
  spinal: '#94a3b8',
  motorNeuron: '#ff6b6b',
  muscle: '#ff8fa3',
  gland: '#fb923c',
  eye: '#a78bfa',
  ear: '#5eead4',
  nose: '#f472b6',
  skin: '#fbbf24',
};

function hexToRgb(h) {
  const c = h.replace('#', '');
  return [parseInt(c.substr(0,2),16), parseInt(c.substr(2,2),16), parseInt(c.substr(4,2),16)];
}
function rgba(hex, a) {
  const [r, g, b] = hexToRgb(hex);
  return `rgba(${r},${g},${b},${a})`;
}

// =====================================================
//  Helpers
// =====================================================
function lerp(a, b, t) { return a + (b - a) * t; }
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function easeInOut(t) { return t * t * (3 - 2 * t); }

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

// =====================================================
//  Brain region data — positions in canvas coords
// =====================================================
const REGIONS = {
  // outer cortex lobes
  frontal:      { x: 470, y: 235, r: 42, color: C.frontal, label: 'Frontal Lobe', role: 'Plans, decides, inhibits, evaluates', depth: 'cortex' },
  motor:        { x: 625, y: 165, r: 26, color: C.motor, label: 'Motor Cortex', role: 'Sends movement commands to muscles', depth: 'cortex' },
  parietal:     { x: 760, y: 180, r: 38, color: C.parietal, label: 'Parietal Lobe', role: 'Touch, body position, spatial awareness', depth: 'cortex' },
  occipital:    { x: 935, y: 250, r: 36, color: C.occipital, label: 'Occipital Lobe', role: 'Vision processing', depth: 'cortex' },
  temporal:     { x: 720, y: 405, r: 40, color: C.temporal, label: 'Temporal Lobe', role: 'Hearing, language, memory', depth: 'cortex' },
  // deep / limbic / subcortical
  thalamus:     { x: 730, y: 290, r: 22, color: C.thalamus, label: 'Thalamus', role: 'Relay center for sensory information', depth: 'deep' },
  hippocampus:  { x: 825, y: 360, r: 18, color: C.hippocampus, label: 'Hippocampus', role: 'Forms and retrieves memories', depth: 'deep' },
  amygdala:     { x: 770, y: 372, r: 16, color: C.amygdala, label: 'Amygdala', role: 'Detects fear and emotional salience', depth: 'deep' },
  hypothalamus: { x: 700, y: 350, r: 16, color: C.hypothalamus, label: 'Hypothalamus', role: 'Body regulation, hormones, fight or flight', depth: 'deep' },
  accumbens:    { x: 620, y: 320, r: 18, color: C.accumbens, label: 'Nucleus Accumbens', role: 'Reward, motivation, reinforcement', depth: 'deep' },
  basalganglia: { x: 670, y: 270, r: 20, color: C.basal, label: 'Basal Ganglia', role: 'Action selection, habit and movement patterns', depth: 'deep' },
  // hindbrain
  cerebellum:   { x: 980, y: 425, r: 40, color: C.cerebellum, label: 'Cerebellum', role: 'Balance, timing, fine motor coordination', depth: 'cortex' },
  brainstem:    { x: 880, y: 485, r: 20, color: C.brainstem, label: 'Brain Stem', role: 'Breathing, heart rate, arousal', depth: 'cortex' },
};

const INPUTS = {
  eye:  { x: 150, y: 215, r: 26, label: 'Eye', color: C.eye },
  ear:  { x: 150, y: 305, r: 26, label: 'Ear', color: C.ear },
  nose: { x: 150, y: 395, r: 26, label: 'Nose', color: C.nose },
  skin: { x: 150, y: 485, r: 26, label: 'Skin / Touch', color: C.skin },
};

const OUTPUTS = {
  spinal:      { x: 1170, y: 535, r: 18, label: 'Spinal Cord', color: C.spinal },
  motorNeuron: { x: 1310, y: 460, r: 18, label: 'Motor Neuron', color: C.motorNeuron },
  muscle:      { x: 1450, y: 360, r: 26, label: 'Muscle', color: C.muscle },
  gland:       { x: 1450, y: 480, r: 22, label: 'Gland', color: C.gland },
};

// =====================================================
//  Brain silhouette (stylized sagittal, facing left)
// =====================================================
function drawBrainSilhouette(ctx, opts = {}) {
  const alpha = opts.alpha != null ? opts.alpha : 1;
  ctx.save();
  ctx.globalAlpha = alpha;

  // Outer halo
  const halo = ctx.createRadialGradient(740, 300, 80, 740, 300, 480);
  halo.addColorStop(0, 'rgba(99, 102, 241, 0.08)');
  halo.addColorStop(0.5, 'rgba(99, 102, 241, 0.03)');
  halo.addColorStop(1, 'rgba(99, 102, 241, 0)');
  ctx.fillStyle = halo;
  ctx.beginPath();
  ctx.arc(740, 300, 480, 0, Math.PI * 2);
  ctx.fill();

  // Cerebrum body (smooth sagittal silhouette)
  ctx.beginPath();
  ctx.moveTo(425, 175);
  ctx.bezierCurveTo(450, 90, 660, 60, 805, 90);
  ctx.bezierCurveTo(945, 115, 1055, 175, 1075, 270);
  ctx.bezierCurveTo(1085, 340, 1055, 385, 1015, 395);
  ctx.bezierCurveTo(1020, 405, 1015, 415, 1010, 420);
  ctx.bezierCurveTo(1040, 425, 1040, 475, 990, 480);
  ctx.bezierCurveTo(960, 485, 935, 470, 925, 460);
  ctx.bezierCurveTo(920, 475, 905, 490, 890, 495);
  ctx.bezierCurveTo(885, 505, 880, 510, 875, 515);
  ctx.lineTo(875, 540);
  ctx.bezierCurveTo(870, 555, 850, 560, 835, 555);
  ctx.bezierCurveTo(830, 540, 825, 525, 820, 510);
  ctx.bezierCurveTo(770, 510, 660, 500, 555, 475);
  ctx.bezierCurveTo(470, 460, 415, 410, 410, 340);
  ctx.bezierCurveTo(405, 280, 410, 220, 425, 175);
  ctx.closePath();

  // Inner gradient fill
  const bodyGrad = ctx.createRadialGradient(700, 270, 50, 720, 290, 400);
  bodyGrad.addColorStop(0, 'rgba(99, 102, 241, 0.18)');
  bodyGrad.addColorStop(0.5, 'rgba(67, 56, 202, 0.10)');
  bodyGrad.addColorStop(1, 'rgba(30, 27, 75, 0.06)');
  ctx.fillStyle = bodyGrad;
  ctx.fill();

  // Outline
  ctx.strokeStyle = 'rgba(165, 180, 252, 0.32)';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // Cerebrum top highlight
  ctx.strokeStyle = 'rgba(199, 210, 254, 0.18)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(440, 150);
  ctx.bezierCurveTo(550, 95, 700, 75, 820, 105);
  ctx.stroke();

  // Sulcus / gyrus texture lines (subtle)
  ctx.strokeStyle = 'rgba(165, 180, 252, 0.12)';
  ctx.lineWidth = 1;
  const sulci = [
    [475, 165, 530, 200, 590, 180],
    [620, 130, 680, 150, 730, 130],
    [780, 130, 840, 160, 890, 150],
    [930, 175, 990, 220, 1020, 280],
    [560, 230, 640, 250, 720, 235],
    [780, 250, 870, 270, 950, 290],
    [480, 320, 560, 340, 660, 335],
    [720, 360, 820, 380, 920, 380],
    [480, 400, 580, 425, 690, 440],
    [780, 460, 850, 470, 900, 465],
  ];
  sulci.forEach(s => {
    ctx.beginPath();
    ctx.moveTo(s[0], s[1]);
    ctx.quadraticCurveTo(s[2], s[3], s[4], s[5]);
    ctx.stroke();
  });

  // Central sulcus (subtle separator between frontal and parietal)
  ctx.strokeStyle = 'rgba(199, 210, 254, 0.18)';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(560, 105);
  ctx.bezierCurveTo(580, 180, 575, 250, 565, 320);
  ctx.stroke();

  // Lateral sulcus
  ctx.beginPath();
  ctx.moveTo(560, 330);
  ctx.bezierCurveTo(660, 345, 770, 360, 870, 365);
  ctx.stroke();

  ctx.restore();
}

// =====================================================
//  Draw a brain region as a glowing node
// =====================================================
function drawRegion(ctx, key, opts = {}) {
  const r = REGIONS[key];
  if (!r) return;
  const t = opts.t || 0;
  const active = opts.active || 0;  // 0..1 activation level
  const highlight = opts.highlight || 0; // 0..1 hover highlight
  const dim = opts.dim || 0; // 0..1 dim factor (used when others active)

  const baseAlpha = 0.7 - dim * 0.5;
  const glowAlpha = active > 0.05 ? (0.35 + active * 0.45) : (0.10 + highlight * 0.18);
  const radius = r.r;
  const pulseR = active > 0.05 ? radius + 6 + Math.sin(t / 220 + r.x * 0.01) * 4 : radius;

  ctx.save();

  // Outer glow halo
  const halo = ctx.createRadialGradient(r.x, r.y, 0, r.x, r.y, radius * 2.4);
  halo.addColorStop(0, rgba(r.color, glowAlpha));
  halo.addColorStop(0.5, rgba(r.color, glowAlpha * 0.4));
  halo.addColorStop(1, rgba(r.color, 0));
  ctx.fillStyle = halo;
  ctx.beginPath();
  ctx.arc(r.x, r.y, radius * 2.4, 0, Math.PI * 2);
  ctx.fill();

  // Active pulse ring
  if (active > 0.05) {
    ctx.strokeStyle = rgba(r.color, 0.55 + active * 0.25);
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.arc(r.x, r.y, pulseR + 2, 0, Math.PI * 2);
    ctx.stroke();

    // Concentric breathing pulse
    const phase = (t / 600 + r.x * 0.005) % 1;
    ctx.strokeStyle = rgba(r.color, (1 - phase) * 0.4 * active);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(r.x, r.y, radius + phase * 22, 0, Math.PI * 2);
    ctx.stroke();
  }

  // Core blob with gradient
  const fillAlpha = baseAlpha + active * 0.3 + highlight * 0.2;
  const core = ctx.createRadialGradient(r.x - radius * 0.3, r.y - radius * 0.3, 0, r.x, r.y, radius);
  core.addColorStop(0, rgba('#ffffff', 0.4 + active * 0.4));
  core.addColorStop(0.35, rgba(r.color, fillAlpha));
  const [cr, cg, cb] = hexToRgb(r.color);
  const dr = Math.max(0, cr - 80), dg = Math.max(0, cg - 80), db = Math.max(0, cb - 80);
  core.addColorStop(1, `rgba(${dr},${dg},${db},${fillAlpha})`);
  ctx.fillStyle = core;
  ctx.beginPath();
  ctx.arc(r.x, r.y, radius, 0, Math.PI * 2);
  ctx.fill();

  // Rim
  ctx.strokeStyle = rgba(r.color, 0.55 + active * 0.35);
  ctx.lineWidth = 1.2 + active * 0.5;
  ctx.stroke();

  // Specular highlight
  ctx.fillStyle = rgba('#ffffff', 0.25 + active * 0.2);
  ctx.beginPath();
  ctx.arc(r.x - radius * 0.35, r.y - radius * 0.35, radius * 0.22, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

// =====================================================
//  Draw sensory input node
// =====================================================
function drawInput(ctx, key, opts = {}) {
  const n = INPUTS[key];
  if (!n) return;
  const t = opts.t || 0;
  const active = opts.active || 0;
  ctx.save();

  // Halo
  const halo = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.r * 2.4);
  halo.addColorStop(0, rgba(n.color, 0.10 + active * 0.5));
  halo.addColorStop(1, rgba(n.color, 0));
  ctx.fillStyle = halo;
  ctx.beginPath();
  ctx.arc(n.x, n.y, n.r * 2.4, 0, Math.PI * 2);
  ctx.fill();

  // Body
  const grad = ctx.createRadialGradient(n.x - 7, n.y - 7, 0, n.x, n.y, n.r);
  grad.addColorStop(0, rgba('#ffffff', 0.6));
  grad.addColorStop(0.4, rgba(n.color, 0.85));
  const [r, g, b] = hexToRgb(n.color);
  grad.addColorStop(1, `rgba(${Math.max(0,r-90)},${Math.max(0,g-90)},${Math.max(0,b-90)},0.95)`);
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = rgba(n.color, 0.65);
  ctx.lineWidth = 1.3;
  ctx.stroke();

  // Icon glyph
  ctx.fillStyle = 'rgba(255,255,255,0.92)';
  ctx.font = '700 14px -apple-system, system-ui';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const glyph = { eye: '👁', ear: '👂', nose: '👃', skin: '✋' }[key] || '';
  if (glyph) ctx.fillText(glyph, n.x, n.y);

  // Label below
  ctx.fillStyle = rgba(n.color, 0.95);
  ctx.font = '600 12px -apple-system, system-ui';
  ctx.fillText(n.label, n.x, n.y + n.r + 16);

  // Active pulse ring
  if (active > 0.05) {
    const phase = (t / 480) % 1;
    ctx.strokeStyle = rgba(n.color, (1 - phase) * 0.55 * active);
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(n.x, n.y, n.r + phase * 22, 0, Math.PI * 2);
    ctx.stroke();
  }

  ctx.restore();
}

// =====================================================
//  Draw output node (muscle, gland, spinal cord, motor neuron)
// =====================================================
function drawOutput(ctx, key, opts = {}) {
  const n = OUTPUTS[key];
  if (!n) return;
  const t = opts.t || 0;
  const active = opts.active || 0;
  ctx.save();

  // Halo
  const halo = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.r * 2.4);
  halo.addColorStop(0, rgba(n.color, 0.12 + active * 0.45));
  halo.addColorStop(1, rgba(n.color, 0));
  ctx.fillStyle = halo;
  ctx.beginPath();
  ctx.arc(n.x, n.y, n.r * 2.4, 0, Math.PI * 2);
  ctx.fill();

  // Body
  const grad = ctx.createRadialGradient(n.x - 6, n.y - 6, 0, n.x, n.y, n.r);
  grad.addColorStop(0, rgba('#ffffff', 0.55));
  grad.addColorStop(0.4, rgba(n.color, 0.85));
  const [r, g, b] = hexToRgb(n.color);
  grad.addColorStop(1, `rgba(${Math.max(0,r-90)},${Math.max(0,g-90)},${Math.max(0,b-90)},0.95)`);
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = rgba(n.color, 0.65);
  ctx.lineWidth = 1.3;
  ctx.stroke();

  // Label
  ctx.fillStyle = rgba(n.color, 0.95);

}

// =====================================================
//  Get position for any node key (input, region, output)
// =====================================================
function getNode(key) {
  if (REGIONS[key]) return REGIONS[key];
  if (INPUTS[key]) return INPUTS[key];
  if (OUTPUTS[key]) return OUTPUTS[key];
  return null;
}

// =====================================================
//  Draw a pathway segment between two nodes with optional glow
// =====================================================
function drawPathwaySegment(ctx, fromKey, toKey, opts = {}) {
  const a = getNode(fromKey);
  const b = getNode(toKey);
  if (!a || !b) return;
  const active = opts.active != null ? opts.active : 0; // 0..1 how active this segment is
  const dim = opts.dim || 0;
  const color = opts.color || '#c7d2fe';
  const curveAmt = opts.curve != null ? opts.curve : 0.18;
  const baseAlpha = active > 0.05 ? 0.55 + active * 0.35 : (0.16 - dim * 0.08);
  const width = 2 + active * 4;

  // Compute control point for a gentle curve
  const dx = b.x - a.x;
  const dy = b.y - a.y;
  const mx = (a.x + b.x) / 2 + dy * curveAmt;
  const my = (a.y + b.y) / 2 - dx * curveAmt;

  ctx.save();
  // Soft glow stroke
  if (active > 0.05) {
    ctx.strokeStyle = rgba(color, 0.18 * active);
    ctx.lineWidth = width + 10;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.quadraticCurveTo(mx, my, b.x, b.y);
    ctx.stroke();
  }
  // Main stroke
  ctx.strokeStyle = rgba(color, baseAlpha);
  ctx.lineWidth = width;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(a.x, a.y);
  ctx.quadraticCurveTo(mx, my, b.x, b.y);
  ctx.stroke();
  ctx.restore();

  return { a, b, mx, my };
}

// Compute point along quadratic curve
function quadPoint(a, mx, my, b, t) {
  const x = (1-t)*(1-t)*a.x + 2*(1-t)*t*mx + t*t*b.x;
  const y = (1-t)*(1-t)*a.y + 2*(1-t)*t*my + t*t*b.y;
  return { x, y };
}

// =====================================================
//  Animate a glowing pulse along a pathway sequence
// =====================================================
function drawSignalPulse(ctx, fromKey, toKey, progress, opts = {}) {
  const a = getNode(fromKey);
  const b = getNode(toKey);
  if (!a || !b) return null;
  const color = opts.color || '#ffd166';
  const curveAmt = opts.curve != null ? opts.curve : 0.18;
  const dx = b.x - a.x, dy = b.y - a.y;
  const mx = (a.x + b.x) / 2 + dy * curveAmt;
  const my = (a.y + b.y) / 2 - dx * curveAmt;
  const t = clamp(progress, 0, 1);

  // Trail
  ctx.save();
  for (let i = 8; i >= 1; i--) {
    const tt = t - i * 0.025;
    if (tt < 0) continue;
    const p = quadPoint(a, mx, my, b, tt);
    const alpha = (1 - i / 8) * 0.35;
    const rad = 5 + (1 - i / 8) * 6;
    const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, rad * 2.5);
    g.addColorStop(0, rgba(color, alpha));
    g.addColorStop(1, rgba(color, 0));
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(p.x, p.y, rad * 2.5, 0, Math.PI * 2);
    ctx.fill();
  }
  // Head
  const p = quadPoint(a, mx, my, b, t);
  const headG = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, 26);
  headG.addColorStop(0, rgba('#ffffff', 0.95));
  headG.addColorStop(0.25, rgba(color, 0.9));
  headG.addColorStop(1, rgba(color, 0));
  ctx.fillStyle = headG;
  ctx.beginPath();
  ctx.arc(p.x, p.y, 26, 0, Math.PI * 2);
  ctx.fill();
  // Core
  ctx.fillStyle = rgba('#ffffff', 0.95);
  ctx.beginPath();
  ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
  return p;
}

// =====================================================
//  Glassmorphic label
// =====================================================
function drawLabel(ctx, text, lx, ly, tx, ty, color = '#ffd166', fontSize = 13) {
  const [r, g, b] = hexToRgb(color);
  ctx.save();
  const leaderGrad = ctx.createLinearGradient(lx, ly, tx, ty);
  leaderGrad.addColorStop(0, `rgba(${r},${g},${b},0.85)`);
  leaderGrad.addColorStop(1, `rgba(${r},${g},${b},0.25)`);
  ctx.strokeStyle = leaderGrad;
  ctx.lineWidth = 1.2;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(lx, ly);
  ctx.lineTo(tx, ty);
  ctx.stroke();

  const pulse = (Math.sin((animT || 0) / 400) + 1) * 0.5;
  ctx.strokeStyle = `rgba(${r},${g},${b},${0.25 + pulse * 0.25})`;
  ctx.lineWidth = 1.3;
  ctx.beginPath();
  ctx.arc(tx, ty, 6 + pulse * 2.5, 0, Math.PI * 2);
  ctx.stroke();

  const dotGlow = ctx.createRadialGradient(tx, ty, 0, tx, ty, 12);
  dotGlow.addColorStop(0, `rgba(${r},${g},${b},0.55)`);
  dotGlow.addColorStop(1, `rgba(${r},${g},${b},0)`);
  ctx.fillStyle = dotGlow;
  ctx.beginPath(); ctx.arc(tx, ty, 12, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(tx, ty, 3, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.beginPath(); ctx.arc(tx - 0.7, ty - 0.7, 1.2, 0, Math.PI * 2); ctx.fill();

  ctx.font = `600 ${fontSize}px -apple-system, system-ui`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const m = ctx.measureText(text);
  const padX = 12, padY = 7;
  const bw = m.width + padX * 2;
  const bh = fontSize + padY * 2;
  const bx = lx - bw / 2, by = ly - bh / 2;

  ctx.shadowBlur = 16;
  ctx.shadowColor = `rgba(${r},${g},${b},0.32)`;
  ctx.shadowOffsetY = 3;
  const bgGrad = ctx.createLinearGradient(0, by, 0, by + bh);
  bgGrad.addColorStop(0, 'rgba(28, 32, 48, 0.92)');
  bgGrad.addColorStop(1, 'rgba(14, 18, 30, 0.92)');
  ctx.fillStyle = bgGrad;
  if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, bh / 2); ctx.fill(); }
  else { ctx.fillRect(bx, by, bw, bh); }
  ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
  ctx.strokeStyle = `rgba(${r},${g},${b},0.55)`;
  ctx.lineWidth = 1;
  if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, bh / 2); ctx.stroke(); }
  ctx.fillStyle = color;
  ctx.fillText(text, lx, ly + 0.5);
  ctx.restore();
}

// =====================================================
//  Draw region label directly above/below the region
// =====================================================
function drawRegionLabel(ctx, key, opts = {}) {
  const r = REGIONS[key];
  if (!r) return;
  const dir = opts.dir || 'auto';
  let lx, ly;
  if (dir === 'auto') {
    // place outside the brain silhouette based on coarse position
    if (r.y < 200) { lx = r.x; ly = r.y - r.r - 24; }
    else if (r.y > 420) { lx = r.x; ly = r.y + r.r + 24; }
    else if (r.x < 600) { lx = r.x - r.r - 70; ly = r.y; }
    else { lx = r.x + r.r + 70; ly = r.y; }
  } else if (dir === 'top') { lx = r.x; ly = r.y - r.r - 22; }
  else if (dir === 'bottom') { lx = r.x; ly = r.y + r.r + 22; }
  else if (dir === 'left') { lx = r.x - r.r - 80; ly = r.y; }
  else if (dir === 'right') { lx = r.x + r.r + 80; ly = r.y; }
  drawLabel(ctx, r.label, lx, ly, r.x, r.y, r.color, opts.fontSize || 12);
}

// =====================================================
//  Draw the full base brain layout (background)
//  - silhouette, optional regions, sensory inputs, outputs
// =====================================================
function drawBrainBase(ctx, opts = {}) {
  drawBrainSilhouette(ctx, { alpha: opts.silhouetteAlpha != null ? opts.silhouetteAlpha : 1 });
  // Spinal cord extending from brain stem down/right
  if (opts.showSpinal !== false) {
    const bs = REGIONS.brainstem;
    const sc = OUTPUTS.spinal;
    ctx.save();
    ctx.strokeStyle = rgba(C.spinal, 0.35);
    ctx.lineWidth = 16;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(bs.x, bs.y);
    ctx.bezierCurveTo(bs.x + 50, bs.y + 30, bs.x + 150, bs.y + 50, sc.x, sc.y);
    ctx.stroke();
    // Inner highlight
    ctx.strokeStyle = rgba('#e2e8f0', 0.20);
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(bs.x, bs.y - 4);
    ctx.bezierCurveTo(bs.x + 50, bs.y + 24, bs.x + 150, bs.y + 44, sc.x, sc.y - 4);
    ctx.stroke();
    ctx.restore();
  }
}

//  State

let currentSceneIdx = 0;
let animT = 0;
let sceneFadeT = 0;
let sceneLocal = {};
let mouseX = -1, mouseY = -1;
let mouseDown = false;

function clearField() { sceneLocal = {}; }

canvas.addEventListener('mousemove', (e) => {
  const rect = canvas.getBoundingClientRect();
  mouseX = (e.clientX - rect.left) * (canvas.width / rect.width);
  mouseY = (e.clientY - rect.top) * (canvas.height / rect.height);
  const s = scenes[currentSceneIdx];
  if (s && s.onMouseMove) s.onMouseMove(mouseX, mouseY);
});
canvas.addEventListener('mouseleave', () => {
  mouseX = -1; mouseY = -1;
  const s = scenes[currentSceneIdx];
  if (s && s.onMouseMove) s.onMouseMove(-1, -1);
});
canvas.addEventListener('mousedown', (e) => {
  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX - rect.left) * (canvas.width / rect.width);
  const y = (e.clientY - rect.top) * (canvas.height / rect.height);
  mouseDown = true;
  const s = scenes[currentSceneIdx];
  if (s && s.onMouseDown) s.onMouseDown(x, y);
});
canvas.addEventListener('mouseup', (e) => {
  mouseDown = false;
  const s = scenes[currentSceneIdx];
  if (s && s.onMouseUp) s.onMouseUp();
});
canvas.addEventListener('click', (e) => {
  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX - rect.left) * (canvas.width / rect.width);
  const y = (e.clientY - rect.top) * (canvas.height / rect.height);
  const s = scenes[currentSceneIdx];
  if (s && s.onClick) s.onClick(x, y);
});

// =====================================================
//  SCENE 1: Intro — From Neuron to Brain Systems
// =====================================================
const sceneIntro = {
  phase: 'Step 1: From Neuron to Brain Systems',
  phaseColor: '#ffd166',
  notes: "In the last two simulations you watched an <strong>action potential</strong> race down a single neuron and cross a single <strong>synapse</strong>. Now we zoom out. Those same signals are firing across <strong>billions of neurons</strong> at the same time, wiring entire brain regions together. The brain is an <strong>input-output machine</strong>: stimulus from the world arrives, travels through neural pathways, and produces a response back into the world.",
  notebook: "Write the title <strong>Brain Pathways: From Stimulus to Response</strong>. Underneath, draw the chain: <strong>action potential → synapse → brain systems</strong>. You will keep adding to this diagram throughout the simulation.",
  setup() {
    clearField();
    sceneLocal = { t: 0, zoom: 0, bolt: 0, sparkles: [] };
  },
  update(dt) {
    sceneLocal.t += dt;
    // Three-stage zoom: neuron view → synapse view → brain view → loop
    const cycle = 6800;
    const phase = (sceneLocal.t % cycle) / cycle;
    sceneLocal.zoom = phase;
    sceneLocal.bolt = (phase < 0.33) ? (phase / 0.33) : 1;
    // Sparkles
    sceneLocal.sparkles = sceneLocal.sparkles.filter(s => s.life > 0);
    sceneLocal.sparkles.forEach(s => { s.life -= dt / 600; s.x += s.vx; s.y += s.vy; });
    if (Math.random() < 0.18) {
      sceneLocal.sparkles.push({ x: W/2 + (Math.random()-0.5)*W*0.6, y: H/2 + (Math.random()-0.5)*H*0.5, vx: (Math.random()-0.5)*0.4, vy: (Math.random()-0.5)*0.4, life: 1 });
    }
  },
  draw(ctx, t) {
    const phase = sceneLocal.zoom;

    // Background ambient sparkles
    sceneLocal.sparkles.forEach(s => {
      const a = s.life * 0.35;
      const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, 18);
      g.addColorStop(0, `rgba(199, 210, 254, ${a})`);
      g.addColorStop(1, `rgba(99, 102, 241, 0)`);
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(s.x, s.y, 18, 0, Math.PI * 2); ctx.fill();
    });

    // Three stages crossfade
    if (phase < 0.33) {
      // Stage 1: neuron with lightning
      const fade = Math.min(1, phase * 4);
      ctx.save();
      ctx.globalAlpha = fade;
      drawConceptNeuron(ctx, 200, 320, 1100, 320, sceneLocal.bolt, t);
      ctx.restore();
      ctx.save();
      ctx.font = '700 26px -apple-system, system-ui';
      ctx.fillStyle = rgba('#ffd166', fade * 0.95);
      ctx.textAlign = 'center';
      ctx.fillText('A signal races down one neuron', W/2, 110);
      ctx.font = '400 16px -apple-system, system-ui';
      ctx.fillStyle = rgba('#a0a0a0', fade * 0.85);
      ctx.fillText('action potential', W/2, 140);
      ctx.restore();
    } else if (phase < 0.66) {
      // Stage 2: synapse
      const p2 = (phase - 0.33) / 0.33;
      const fade = Math.min(1, p2 * 4) * (1 - Math.max(0, p2 - 0.85) * 6);
      ctx.save();
      ctx.globalAlpha = Math.max(0, Math.min(1, fade));
      drawConceptSynapse(ctx, W/2, 340, p2, t);
      ctx.restore();
      ctx.save();
      ctx.globalAlpha = Math.max(0, Math.min(1, fade));
      ctx.font = '700 26px -apple-system, system-ui';
      ctx.fillStyle = '#f472b6';
      ctx.textAlign = 'center';
      ctx.fillText('It crosses a synapse to the next neuron', W/2, 110);
      ctx.font = '400 16px -apple-system, system-ui';
      ctx.fillStyle = '#a0a0a0';
      ctx.fillText('neurotransmitters bridge the gap', W/2, 140);
      ctx.restore();
    } else {
      // Stage 3: full brain reveal
      const p3 = (phase - 0.66) / 0.34;
      const fade = Math.min(1, p3 * 3);
      ctx.save();
      ctx.globalAlpha = fade;
      drawBrainBase(ctx, { silhouetteAlpha: fade });
      // Tease activation of multiple regions
      const flicker = (Math.sin(t / 400) + 1) * 0.5;
      const activeKeys = ['frontal','motor','parietal','occipital','temporal','thalamus','amygdala','accumbens','cerebellum','brainstem','hippocampus','hypothalamus','basalganglia'];
      activeKeys.forEach((k, i) => {
        const phaseOffset = (Math.sin(t / 500 + i * 0.7) + 1) * 0.5;
        drawRegion(ctx, k, { t, active: 0.3 + phaseOffset * 0.35 });
      });
      Object.keys(INPUTS).forEach((k, i) => {
        const phaseOffset = (Math.sin(t / 600 + i) + 1) * 0.5;
        drawInput(ctx, k, { t, active: 0.2 + phaseOffset * 0.3 });
      });
      Object.keys(OUTPUTS).forEach((k, i) => {
        const phaseOffset = (Math.sin(t / 700 + i + 2) + 1) * 0.5;
        drawOutput(ctx, k, { t, active: 0.2 + phaseOffset * 0.3 });
      });
      ctx.restore();
      ctx.save();
      ctx.globalAlpha = fade;
      ctx.font = '700 26px -apple-system, system-ui';
      ctx.fillStyle = '#c7d2fe';
      ctx.textAlign = 'center';
      ctx.fillText('Billions of those signals build entire brain systems', W/2, 110);
      ctx.font = '400 16px -apple-system, system-ui';
      ctx.fillStyle = '#a0a0a0';
      ctx.fillText('stimulus enters, the brain processes, response leaves', W/2, 140);
      ctx.restore();
    }
  }
};

// =====================================================
//  Concept neuron (simplified, for intro)
// =====================================================
function drawConceptNeuron(ctx, x0, y0, x1, y1, progress, t) {
  ctx.save();
  // dendrites
  ctx.strokeStyle = 'rgba(209, 154, 143, 0.6)';
  ctx.lineWidth = 5;
  ctx.lineCap = 'round';
  for (let i = 0; i < 6; i++) {
    const a = -Math.PI + (i / 5) * Math.PI * 0.6 - Math.PI * 0.2;
    ctx.beginPath();
    ctx.moveTo(x0, y0);
    ctx.lineTo(x0 + Math.cos(a) * 100, y0 + Math.sin(a) * 100);
    ctx.stroke();
  }
  // soma
  const somaGrad = ctx.createRadialGradient(x0 - 10, y0 - 10, 0, x0, y0, 50);
  somaGrad.addColorStop(0, '#f8d9ce');
  somaGrad.addColorStop(0.7, '#d49a8d');
  somaGrad.addColorStop(1, '#a86456');
  ctx.fillStyle = somaGrad;
  ctx.beginPath();
  ctx.arc(x0, y0, 50, 0, Math.PI * 2);
  ctx.fill();
  // axon
  ctx.strokeStyle = '#c78373';
  ctx.lineWidth = 22;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x0 + 35, y0);
  ctx.lineTo(x1 - 50, y1);
  ctx.stroke();
  // terminals
  ctx.fillStyle = '#c78373';
  for (let i = 0; i < 5; i++) {
    const a = -0.4 + i * 0.2;
    const ex = x1 - 50 + Math.cos(a) * 90;
    const ey = y1 + Math.sin(a) * 90;
    ctx.lineWidth = 9;
    ctx.strokeStyle = '#c78373';
    ctx.beginPath();
    ctx.moveTo(x1 - 50, y1);
    ctx.lineTo(ex, ey);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(ex, ey, 12, 0, Math.PI * 2);
    ctx.fill();
  }
  // lightning bolt along axon
  if (progress > 0) {
    ctx.save();
    ctx.strokeStyle = 'rgba(255, 209, 102, 0.55)';
    ctx.lineWidth = 12;
    ctx.lineCap = 'round';
    ctx.shadowBlur = 24;
    ctx.shadowColor = 'rgba(255, 209, 102, 0.9)';
    const segs = 22;
    ctx.beginPath();
    for (let i = 0; i <= segs; i++) {
      const f = i / segs;
      if (f > progress) break;
      const px = lerp(x0 + 35, x1 - 50, f);
      const py = y0 + Math.sin(f * Math.PI * 2.2) * 6 + (Math.random()-0.5) * 12 * (f < progress ? 1 : 0);
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.stroke();
    ctx.shadowBlur = 14;
    ctx.shadowColor = 'rgba(255, 255, 255, 0.9)';
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.95)';
    ctx.lineWidth = 3.5;
    ctx.beginPath();
    for (let i = 0; i <= segs; i++) {
      const f = i / segs;
      if (f > progress) break;
      const px = lerp(x0 + 35, x1 - 50, f);
      const py = y0 + Math.sin(f * Math.PI * 2.2) * 6;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.stroke();
    ctx.restore();
  }
  ctx.restore();
}

// =====================================================
//  Concept synapse (simplified)
// =====================================================
function drawConceptSynapse(ctx, cx, cy, progress, t) {
  ctx.save();
  // pre-terminal
  const preGrad = ctx.createRadialGradient(cx - 200, cy - 50, 10, cx - 200, cy, 200);
  preGrad.addColorStop(0, '#f8d9ce');
  preGrad.addColorStop(0.6, '#d49a8d');
  preGrad.addColorStop(1, '#a86456');
  ctx.fillStyle = preGrad;
  ctx.beginPath();
  ctx.ellipse(cx - 180, cy, 130, 110, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = 'rgba(140, 75, 60, 0.5)';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  // post-dendrite
  const postGrad = ctx.createRadialGradient(cx + 200, cy - 50, 10, cx + 200, cy, 200);
  postGrad.addColorStop(0, '#d4c0ee');
  postGrad.addColorStop(0.6, '#9a7fc0');
  postGrad.addColorStop(1, '#705396');
  ctx.fillStyle = postGrad;
  ctx.beginPath();
  ctx.ellipse(cx + 180, cy, 130, 110, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = 'rgba(80, 60, 110, 0.5)';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  // cleft gap
  ctx.strokeStyle = 'rgba(255,255,255,0.15)';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(cx - 50, cy - 100);
  ctx.lineTo(cx - 50, cy + 100);
  ctx.moveTo(cx + 50, cy - 100);
  ctx.lineTo(cx + 50, cy + 100);
  ctx.stroke();
  // NTs floating in cleft
  for (let i = 0; i < 10; i++) {
    const px = cx - 40 + (i / 9) * 80 + Math.sin(t / 300 + i) * 5;
    const py = cy - 80 + (i % 4) * 50 + Math.sin(t / 500 + i * 1.3) * 5;
    const flow = Math.min(1, progress * 2);
    const xpos = lerp(cx - 70, px, flow);
    const cg = ctx.createRadialGradient(xpos - 1, py - 1, 0, xpos, py, 8);
    cg.addColorStop(0, 'rgba(255,255,255,0.95)');
    cg.addColorStop(0.35, '#f472b6');
    cg.addColorStop(1, '#a02868');
    ctx.fillStyle = cg;
    ctx.beginPath();
    ctx.arc(xpos, py, 7, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function pickNode(x, y) {
  // sort by radius ascending so small deep structures get clicked
  // over the larger cortex blobs they sit inside
  const all = [...Object.keys(REGIONS), ...Object.keys(INPUTS), ...Object.keys(OUTPUTS)];
  all.sort((a, b) => getNode(a).r - getNode(b).r);
  for (const k of all) {
    const n = getNode(k);
    const dx = x - n.x, dy = y - n.y;
    if (Math.hypot(dx, dy) <= n.r + 6) return k;
  }
  return null;
}

function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
  const words = text.split(' ');
  let line = '';
  let yy = y;
  for (let i = 0; i < words.length; i++) {
    const test = line + words[i] + ' ';
    const m = ctx.measureText(test);
    if (m.width > maxWidth && i > 0) {
      ctx.fillText(line, x, yy);
      line = words[i] + ' ';
      yy += lineHeight;
    } else {
      line = test;
    }
  }
  ctx.fillText(line, x, yy);
}

// =====================================================
//  Pathway tracer — animates a sequence of node keys with glowing pulses
// =====================================================
function tracePathway(ctx, nodes, t, opts = {}) {
  if (!nodes || nodes.length < 2) return null;
  const speed = opts.speed || 0.0006;
  const loop = opts.loop !== false;
  const color = opts.color || '#ffd166';
  // Compute progress through whole sequence
  const segCount = nodes.length - 1;
  const totalT = (t * speed) % (loop ? 1 : Infinity);
  const segProgress = totalT * segCount;
  const currentSeg = Math.floor(segProgress);
  const inSegT = segProgress - currentSeg;

  // Draw all segments with activation level
  for (let i = 0; i < segCount; i++) {
    let activation;
    if (i < currentSeg) activation = 0.9; // already fired
    else if (i === currentSeg) activation = 0.4 + inSegT * 0.5;
    else activation = 0.15;
    drawPathwaySegment(ctx, nodes[i], nodes[i+1], { color, active: activation });
  }

  // Draw current pulse position
  if (currentSeg < segCount) {
    const a = getNode(nodes[currentSeg]);
    const b = getNode(nodes[currentSeg + 1]);
    if (a && b) {
      drawSignalPulse(ctx, nodes[currentSeg], nodes[currentSeg + 1], inSegT, { color });
    }
  }

  return { currentSeg, inSegT };
}

// Compute which nodes are "lit" based on pathway progress
function getActivationMap(nodes, traceState) {
  const map = {};
  if (!traceState) return map;
  for (let i = 0; i <= traceState.currentSeg && i < nodes.length; i++) {
    map[nodes[i]] = 1;
  }
  if (traceState.currentSeg + 1 < nodes.length) {
    map[nodes[traceState.currentSeg + 1]] = traceState.inSegT;
  }
  return map;
}

// Draw all nodes (regions/inputs/outputs) with activation from a map
function drawAllNodes(ctx, t, activationMap, dimUnlit) {
  Object.keys(REGIONS).forEach(k => {
    const a = activationMap[k] || 0;
    drawRegion(ctx, k, { t, active: a, dim: dimUnlit && a < 0.05 ? 0.6 : 0 });
  });
  Object.keys(INPUTS).forEach(k => {
    const a = activationMap[k] || 0;
    drawInput(ctx, k, { t, active: a });
  });
  Object.keys(OUTPUTS).forEach(k => {
    const a = activationMap[k] || 0;
    drawOutput(ctx, k, { t, active: a });
  });
}

function drawAnimatedSequence(ctx, nodes, progress, color, t) {
  if (!nodes || nodes.length < 2) return;
  const segCount = nodes.length - 1;
  const segProgress = progress * segCount;
  const currentSeg = Math.floor(Math.min(segProgress, segCount - 0.0001));
  const inSegT = segProgress - currentSeg;
  // segments
  for (let i = 0; i < segCount; i++) {
    let a;
    if (i < currentSeg) a = 0.9;
    else if (i === currentSeg) a = 0.5 + inSegT * 0.4;
    else a = 0.18;
    drawPathwaySegment(ctx, nodes[i], nodes[i+1], { color, active: a });
  }
  if (currentSeg < segCount && progress < 1) {
    drawSignalPulse(ctx, nodes[currentSeg], nodes[currentSeg+1], inSegT, { color });
  }
}

function drawEyeDiagram(ctx, x, y, t) {
  ctx.save();
  // ambient glow
  const halo = ctx.createRadialGradient(x + 60, y + 30, 0, x + 60, y + 30, 110);
  halo.addColorStop(0, rgba(C.occipital, 0.15));
  halo.addColorStop(1, rgba(C.occipital, 0));
  ctx.fillStyle = halo;
  ctx.beginPath(); ctx.arc(x + 60, y + 30, 110, 0, Math.PI * 2); ctx.fill();
  // eyeball
  const eyeGrad = ctx.createRadialGradient(x + 55, y + 20, 5, x + 60, y + 30, 60);
  eyeGrad.addColorStop(0, '#ffffff');
  eyeGrad.addColorStop(0.7, '#e0e7ff');
  eyeGrad.addColorStop(1, '#a5b4fc');
  ctx.fillStyle = eyeGrad;
  ctx.beginPath();
  ctx.ellipse(x + 60, y + 30, 55, 40, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = 'rgba(165, 180, 252, 0.6)';
  ctx.lineWidth = 1.3;
  ctx.stroke();
  // iris
  const irisGrad = ctx.createRadialGradient(x + 25, y + 26, 0, x + 25, y + 30, 18);
  irisGrad.addColorStop(0, '#c4b5fd');
  irisGrad.addColorStop(1, '#4338ca');
  ctx.fillStyle = irisGrad;
  ctx.beginPath();
  ctx.arc(x + 25, y + 30, 18, 0, Math.PI * 2);
  ctx.fill();
  // pupil
  ctx.fillStyle = '#0a0a0a';
  ctx.beginPath();
  ctx.arc(x + 25, y + 30, 8, 0, Math.PI * 2);
  ctx.fill();
  // light ray entering
  const rayProgress = ((t / 1500) % 1);
  ctx.strokeStyle = rgba('#ffd166', 0.85);
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  ctx.shadowBlur = 16;
  ctx.shadowColor = 'rgba(255, 209, 102, 0.7)';
  ctx.beginPath();
  ctx.moveTo(x - 10, y + 30);
  ctx.lineTo(x + 25 + rayProgress * 35, y + 30);
  ctx.stroke();
  ctx.shadowBlur = 0;
  // retina (back of eye)
  ctx.strokeStyle = rgba(C.occipital, 0.85);
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(x + 60, y + 30, 42, -Math.PI * 0.35, Math.PI * 0.35);
  ctx.stroke();
  // optic nerve exit
  ctx.strokeStyle = rgba(C.occipital, 0.6);
  ctx.lineWidth = 6;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x + 105, y + 30);
  ctx.quadraticCurveTo(x + 140, y + 50, INPUTS.eye.x - 15, INPUTS.eye.y);
  ctx.stroke();
  // labels
  ctx.font = '600 11px -apple-system, system-ui';
  ctx.fillStyle = '#a0a0a0';
  ctx.textAlign = 'center';
  ctx.fillText('cornea + lens', x + 25, y - 6);
  ctx.fillText('retina', x + 90, y + 78);
  ctx.fillText('optic nerve', x + 130, y - 6);
  ctx.restore();
}

  setup() {

function checkPathway(built, correct) {
  if (built.length === 0) return { ok: false, msg: 'Start by clicking the sensory input that detects the stimulus.' };
  // Check sensory start
  if (!INPUTS[built[0]] && !REGIONS[built[0]]) {
    // sensor missing
  }
  // exact match
  if (arrEq(built, correct)) {
    const ch = CHALLENGES.find(c => arrEq(c.correct, correct));
    return { ok: true, msg: ch ? ch.success : 'Exactly right.' };
  }
  // Plausibility: starts with a sensory input, ends with an output, includes thalamus for non-smell, etc.
  const startsWithSensor = INPUTS[built[0]];
  const correctSensor = correct[0];
  if (built[0] !== correctSensor) {
    if (built[0] === 'nose' && correctSensor !== 'nose') return { ok: false, msg: 'This stimulus is not a smell. Pick a different sensory input.' };
    if (correctSensor === 'nose') return { ok: false, msg: 'This is a smell. Try starting from the nose. Remember, smell skips the thalamus.' };
    if (correctSensor === 'skin') return { ok: false, msg: 'This is a touch or pain stimulus. Start from the skin.' };
    if (correctSensor === 'ear') return { ok: false, msg: 'This is a sound. Start from the ear.' };
    if (correctSensor === 'eye') return { ok: false, msg: 'This is a visual stimulus. Start from the eye.' };
  }
  // Thalamus check
  if (correct.includes('thalamus') && !built.includes('thalamus')) {
    return { ok: false, msg: 'Most sensory information passes through the thalamus first. Add it before the cortex.' };
  }
  // Amygdala check (fear)
  if (correct.includes('amygdala') && !built.includes('amygdala')) {
    return { ok: false, msg: 'This pathway involves emotion or fear. Try adding the amygdala.' };
  }
  // Hippocampus check (memory)
  if (correct.includes('hippocampus') && !built.includes('hippocampus')) {
    return { ok: false, msg: 'This pathway involves memory. Try adding the hippocampus.' };
  }
  // Accumbens (reward)
  if (correct.includes('accumbens') && !built.includes('accumbens')) {
    return { ok: false, msg: 'Reward pathways involve the nucleus accumbens. Try adding it.' };
  }
  // Cerebellum (movement)
  if (correct.includes('cerebellum') && !built.includes('cerebellum')) {
    return { ok: false, msg: 'Balance and coordination involve the cerebellum. Try adding it.' };
  }
  // Output check
  const outputs = ['muscle','gland','motorNeuron'];
  const lastNeeded = correct[correct.length - 1];
  if (outputs.includes(lastNeeded) && !built.includes(lastNeeded)) {
    return { ok: false, msg: 'This pathway needs an output. Make sure you end with a muscle or gland response.' };
  }
  // length check
  if (built.length < correct.length - 1) {
    return { ok: false, msg: 'Your pathway is missing some steps. Think about what relays and processes the signal.' };
  }
  return { ok: false, msg: 'This is close but not the simplest plausible route. Compare your steps to the canonical pathway and try again.' };
}

function arrEq(a, b) {
  if (a.length !== b.length) return false;
  for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return false;
  return true;
}

function setScene(i) {
  currentSceneIdx = i;
  animT = 0;
  sceneFadeT = 0;
  const s = scenes[i];
  if (s.setup) s.setup();
  phaseNameEl.textContent = s.phase;
  phaseNameEl.style.color = s.phaseColor;
  notesEl.innerHTML = s.notes;
  stepHeadingEl.textContent = s.phase;
  notebookTextEl.innerHTML = s.notebook;
  stepIndicator.textContent = `${pad2(i + 1)} / ${pad2(scenes.length)}`;
  prevBtn.disabled = i === 0;
  nextBtn.disabled = i === scenes.length - 1;
  nextBtn.textContent = i === scenes.length - 1 ? 'Done' : 'Next →';

  // Pathway key reveal (controlled per scene or by Scenario Lab)
  if (s.pathwayKey) {
    pathwayKeyEl.innerHTML = '<strong>Pathway:</strong> ' + s.pathwayKey;
    pathwayKeyEl.classList.remove('hidden');
  } else {
    pathwayKeyEl.classList.add('hidden');
  }

  simControlsEl.innerHTML = '';
  if (s.controlsHTML) {
    simControlsEl.innerHTML = s.controlsHTML;
    simControlsEl.classList.add('visible');
    if (s.bindControls) s.bindControls();
  } else {
    simControlsEl.classList.remove('visible');
  }

  // Student notes show for every scene
  studentNotesEl.classList.add('visible');
  snTextarea.value = loadNotes(i);

  // Cursor for interactive scenes
  if (s.onMouseMove || s.onClick) canvas.classList.add('interactive');

  if (e.target && e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'ArrowRight' && currentSceneIdx < scenes.length - 1) setScene(currentSceneIdx + 1);
  if (e.key === 'ArrowLeft' && currentSceneIdx > 0) setScene(currentSceneIdx - 1);
});

// =====================================================
let lastTs = null;
function tick(ts) {
  if (lastTs == null) lastTs = ts;
  const dt = Math.min(50, ts - lastTs);
  lastTs = ts;
  animT += dt;
  sceneFadeT = Math.min(1, sceneFadeT + dt / 600);
  const s = scenes[currentSceneIdx];
  if (s.update) s.update(dt);
  ctx.save();
  ctx.fillStyle = '#0a0a0a';
  ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = sceneFadeT;
  s.draw(ctx, animT);
  ctx.restore();
  requestAnimationFrame(tick);
}

setScene(0);
requestAnimationFrame(tick);
</script>
