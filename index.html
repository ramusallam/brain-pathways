<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Brain Pathways: From Stimulus to Response</title>
<style>
  :root {
    --bg-0: #0a0a0a;
    --ink-hi: #f5f5f5;
    --ink-mid: #a0a0a0;
    --ink-low: #6b7280;
    --accent: #6366f1;
    --panel: #141414;
    --panel-border: rgba(255,255,255,0.10);
    --note-bg: #fdf1c6;
    --note-ink: #2a1e08;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
    background: var(--bg-0);
    color: var(--ink-hi);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  header {
    padding: 14px 32px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    max-width: 1200px;
    margin: 0 auto;
  }
  header .title {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--ink-low);
  }
  .step-indicator {
    font-size: 13px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    color: var(--ink-low);
    letter-spacing: 1px;
  }
  main {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 32px 20px;
  }
  .stage {
    position: relative;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    overflow: hidden;
    box-shadow:
      0 30px 80px rgba(0,0,0,0.5),
      inset 0 1px 0 rgba(255,255,255,0.04);
  }
  canvas { display: block; width: 100%; height: auto; cursor: default; }
  canvas.interactive { cursor: pointer; }
  .phase-bar {
    padding: 16px 28px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 24px;
    align-items: center;
    border-top: 1px solid var(--panel-border);
    background: rgba(5, 8, 20, 0.4);
  }
  .phase-name {
    font-size: 23px;
    font-weight: 700;
    letter-spacing: 0.1px;
    color: var(--accent);
    transition: color 400ms ease;
  }
  .sim-controls {
    display: none;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: flex-end;
    max-width: 720px;
  }
  .sim-controls.visible { display: flex; }
  .sim-readout {
    font-size: 13px;
    color: var(--ink-mid);
    letter-spacing: 0.2px;
    padding: 6px 12px;
    border-radius: 8px;
    background: rgba(99,102,241,0.08);
    border: 1px solid rgba(99,102,241,0.25);
  }
  .sim-readout strong { color: #c7d2fe; font-variant-numeric: tabular-nums; }
  button.chip {
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.3px;
    padding: 7px 12px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.10);
    background: rgba(255,255,255,0.03);
    color: var(--ink-hi);
    cursor: pointer;
    transition: all 150ms;
  }
  button.chip:hover {
    background: rgba(255,255,255,0.07);
    border-color: rgba(255,255,255,0.20);
  }
  button.chip.active {
    background: rgba(99,102,241,0.20);
    border-color: rgba(99,102,241,0.65);
    color: #c7d2fe;
  }
  button.chip.warm {
    background: rgba(244, 114, 182, 0.08);
    border-color: rgba(244, 114, 182, 0.35);
    color: #f9a8d4;
  }
  button.chip.warm:hover { background: rgba(244, 114, 182, 0.18); }
  .content { margin-top: 14px; }
  .notes-card {
    background: var(--note-bg);
    color: var(--note-ink);
    padding: 16px 22px 14px;
    border-radius: 12px;
    font-size: 15px;
    line-height: 1.55;
    position: relative;
    box-shadow:
      0 14px 40px rgba(255, 209, 102, 0.08),
      inset 0 0 0 1px rgba(0,0,0,0.02);
  }
  .step-heading {
    font-weight: 700;
    font-size: 16px;
    color: #7a3a00;
    margin-bottom: 4px;
    letter-spacing: 0.2px;
  }
  .notes-card p { margin: 0 0 6px; }
  .notes-card strong { font-weight: 700; color: #2a1e08; }
  .pathway-key {
    margin-top: 8px;
    padding: 8px 12px;
    background: rgba(0,0,0,0.04);
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    color: #5b3a08;
    line-height: 1.5;
    letter-spacing: 0.1px;
  }
  .pathway-key.hidden { display: none; }
  .pathway-key .arrow { color: #d4a554; margin: 0 4px; }

  .notebook-prompt {
    margin-top: 10px;
    padding: 12px 16px;
    background: linear-gradient(90deg, rgba(255, 209, 102, 0.15), rgba(244, 114, 182, 0.12));
    border: 1.5px solid rgba(255, 209, 102, 0.45);
    border-left: 5px solid #ffd166;
    border-radius: 10px;
    display: flex;
    align-items: flex-start;
    gap: 12px;
    font-size: 14px;
    line-height: 1.5;
    color: #f3d589;
  }
  .notebook-prompt .np-tag {
    flex-shrink: 0;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 2px;
    padding: 4px 9px;
    background: #ffd166;
    color: #2a1e08;
    border-radius: 5px;
    margin-top: 1px;
  }
  .notebook-prompt strong { color: #ffd166; font-weight: 700; }

  nav {
    margin-top: 14px;
    display: flex;
    justify-content: space-between;
    gap: 12px;
  }
  button {
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.5px;
    padding: 10px 20px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.03);
    color: var(--ink-hi);
    cursor: pointer;
    transition: background 150ms, transform 50ms, border-color 150ms;
  }
  button:hover:not(:disabled) {
    background: rgba(255,255,255,0.06);
    border-color: rgba(255,255,255,0.15);
  }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: 0.3; cursor: not-allowed; }
  button.primary {
    background: linear-gradient(180deg, #6366f1 0%, #4f46e5 100%);
    color: #f5f5ff;
    border-color: rgba(99, 102, 241, 0.55);
    box-shadow: 0 6px 20px rgba(99, 102, 241, 0.25);
  }
  button.primary:hover { filter: brightness(1.08); }
  .btn-group { display: flex; gap: 10px; }
  @media (max-width: 720px) {
    .phase-bar { grid-template-columns: 1fr; }
    .sim-controls { justify-content: flex-start; }
    .phase-name { font-size: 20px; }
  }
</style>
</head>
<body>
<header>
  <div class="title">Brain Pathways: From Stimulus to Response</div>
  <div class="step-indicator" id="stepIndicator">01 / 13</div>
</header>

<main>
  <div class="stage">
    <canvas id="canvas" width="1600" height="650"></canvas>
    <div class="phase-bar">
      <div class="phase-name" id="phaseName">Step 1</div>
      <div class="sim-controls" id="simControls"></div>
    </div>
  </div>

  <div class="content">
    <div class="notes-card">
      <div class="step-heading" id="stepHeading">Step 1</div>
      <p id="notes"></p>
      <div class="pathway-key hidden" id="pathwayKey"></div>
    </div>
    <div class="notebook-prompt" id="notebookPrompt">
      <div class="np-tag">✎ NOTES</div>
      <div id="notebookText"></div>
    </div>
  </div>

  <nav>
    <button id="resetBtn">Start Over</button>
    <div class="btn-group">
      <button id="prevBtn">← Back</button>
      <button id="nextBtn" class="primary">Next →</button>
    </div>
  </nav>
</main>

<script>
// ============================================================================
// COLORS & CONSTANTS
// ============================================================================

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const W = canvas.width;   // 1600
const H = canvas.height;  // 650

// Region / input / output color tokens used by every canvas drawer.
const C = {
  accent: '#6366f1',
  frontal: '#ff8fa3',
  motor: '#ff6b6b',
  parietal: '#7dd3fc',
  occipital: '#a78bfa',
  temporal: '#5eead4',
  thalamus: '#c4b5fd',
  hippocampus: '#ffd166',
  amygdala: '#f87171',
  hypothalamus: '#fb923c',
  accumbens: '#fbbf24',
  basal: '#84cc16',
  cerebellum: '#4ade80',
  brainstem: '#22d3ee',
  spinal: '#94a3b8',
  motorNeuron: '#ff6b6b',
  muscle: '#ff8fa3',
  gland: '#fb923c',
  eye: '#a78bfa',
  ear: '#5eead4',
  nose: '#f472b6',
  skin: '#fbbf24',
};

function hexToRgb(h) {
  const c = h.replace('#', '');
  return [parseInt(c.substr(0,2),16), parseInt(c.substr(2,2),16), parseInt(c.substr(4,2),16)];
}
function rgba(hex, a) {
  const [r, g, b] = hexToRgb(hex);
  return `rgba(${r},${g},${b},${a})`;
}

// ============================================================================
// GEOMETRY HELPERS
// ============================================================================

function lerp(a, b, t) { return a + (b - a) * t; }
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function easeInOut(t) { return t * t * (3 - 2 * t); }

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

// ============================================================================
// REGION / INPUT / OUTPUT DATA
// ============================================================================
// Brain region positions + roles.
//   kind: 'lobe' (cortex polygon) | 'deep' (subcortical shape) | 'cerebellum' | 'brainstem'
const REGIONS = {
  // Cortex lobes
  frontal:      { x: 515, y: 230, r: 60, color: C.frontal, label: 'Frontal Lobe', role: 'Plans, decides, inhibits, evaluates', kind: 'lobe' },
  motor:        { x: 628, y: 198, r: 22, color: C.motor, label: 'Motor Cortex', role: 'Sends movement commands to muscles', kind: 'lobe' },
  parietal:     { x: 780, y: 200, r: 60, color: C.parietal, label: 'Parietal Lobe', role: 'Touch, body position, spatial awareness', kind: 'lobe' },
  occipital:    { x: 990, y: 260, r: 50, color: C.occipital, label: 'Occipital Lobe', role: 'Vision processing', kind: 'lobe' },
  temporal:     { x: 700, y: 408, r: 62, color: C.temporal, label: 'Temporal Lobe', role: 'Hearing, language, memory', kind: 'lobe' },
  // Deep structures (subcortical)
  thalamus:     { x: 745, y: 280, r: 28, color: C.thalamus, label: 'Thalamus', role: 'Relay center for sensory information', kind: 'deep' },
  hypothalamus: { x: 720, y: 340, r: 18, color: C.hypothalamus, label: 'Hypothalamus', role: 'Body regulation, hormones, fight or flight', kind: 'deep' },
  hippocampus:  { x: 820, y: 372, r: 20, color: C.hippocampus, label: 'Hippocampus', role: 'Forms and retrieves memories', kind: 'deep' },
  amygdala:     { x: 778, y: 380, r: 16, color: C.amygdala, label: 'Amygdala', role: 'Detects fear and emotional salience', kind: 'deep' },
  accumbens:    { x: 615, y: 325, r: 18, color: C.accumbens, label: 'Nucleus Accumbens', role: 'Reward, motivation, reinforcement', kind: 'deep' },
  basalganglia: { x: 685, y: 285, r: 22, color: C.basal, label: 'Basal Ganglia', role: 'Action selection, habit and movement patterns', kind: 'deep' },
  // Hindbrain
  cerebellum:   { x: 985, y: 445, r: 50, color: C.cerebellum, label: 'Cerebellum', role: 'Balance, timing, fine motor coordination', kind: 'cerebellum' },
  brainstem:    { x: 885, y: 490, r: 36, color: C.brainstem, label: 'Brain Stem', role: 'Breathing, heart rate, arousal', kind: 'brainstem' },
};

const INPUTS = {
  eye:  { x: 145, y: 215, r: 32, label: 'Eye', color: C.eye },
  ear:  { x: 145, y: 305, r: 30, label: 'Ear', color: C.ear },
  nose: { x: 145, y: 395, r: 28, label: 'Nose', color: C.nose },
  skin: { x: 145, y: 490, r: 32, label: 'Skin / Touch', color: C.skin },
};

const OUTPUTS = {
  spinal:      { x: 1200, y: 545, r: 22, label: 'Spinal Cord', color: C.spinal },
  motorNeuron: { x: 1330, y: 480, r: 18, label: 'Motor Neuron', color: C.motorNeuron },
  muscle:      { x: 1470, y: 365, r: 40, label: 'Muscle', color: C.muscle },
  gland:       { x: 1470, y: 490, r: 32, label: 'Adrenal Gland', color: C.gland },
};

// ============================================================================
// ANATOMY DRAWERS
// ============================================================================
// Lobe path definitions — closed polygons via beziers. All lobes share
// boundary curves so the brain reads as one anatomical surface, divided
// by sulci.
function pathFrontal(ctx) {
  ctx.beginPath();
  ctx.moveTo(430, 175);
  ctx.bezierCurveTo(440, 130, 510, 95, 590, 92);
  ctx.bezierCurveTo(625, 90, 645, 95, 648, 98);
  ctx.bezierCurveTo(644, 165, 628, 235, 610, 295);
  ctx.bezierCurveTo(555, 300, 490, 300, 445, 295);
  ctx.bezierCurveTo(422, 290, 412, 268, 410, 240);
  ctx.bezierCurveTo(408, 215, 415, 192, 430, 175);
  ctx.closePath();
}
function pathParietal(ctx) {
  ctx.beginPath();
  ctx.moveTo(648, 98);
  ctx.bezierCurveTo(720, 80, 815, 80, 893, 105);
  ctx.bezierCurveTo(898, 165, 902, 220, 908, 260);
  ctx.bezierCurveTo(870, 278, 800, 290, 720, 295);
  ctx.bezierCurveTo(670, 297, 630, 296, 610, 295);
  ctx.bezierCurveTo(628, 235, 644, 165, 648, 98);
  ctx.closePath();
}
function pathOccipital(ctx) {
  ctx.beginPath();
  ctx.moveTo(893, 105);
  ctx.bezierCurveTo(980, 130, 1045, 180, 1070, 240);
  ctx.bezierCurveTo(1082, 290, 1070, 350, 1042, 392);
  ctx.bezierCurveTo(1010, 400, 970, 392, 945, 378);
  ctx.bezierCurveTo(925, 350, 915, 310, 908, 260);
  ctx.bezierCurveTo(902, 220, 898, 165, 893, 105);
  ctx.closePath();
}
function pathTemporal(ctx) {
  ctx.beginPath();
  ctx.moveTo(445, 295);
  ctx.bezierCurveTo(490, 300, 555, 300, 610, 295);
  ctx.bezierCurveTo(670, 297, 720, 295, 800, 290);
  ctx.bezierCurveTo(870, 278, 900, 268, 908, 260);
  ctx.bezierCurveTo(915, 310, 925, 350, 945, 378);
  ctx.bezierCurveTo(905, 425, 845, 462, 780, 470);
  ctx.bezierCurveTo(680, 472, 580, 462, 500, 440);
  ctx.bezierCurveTo(450, 422, 425, 385, 425, 350);
  ctx.bezierCurveTo(427, 322, 435, 305, 445, 295);
  ctx.closePath();
}
// Motor cortex: narrow precentral gyrus along central sulcus
function pathMotor(ctx) {
  ctx.beginPath();
  ctx.moveTo(615, 100);
  ctx.bezierCurveTo(614, 165, 600, 235, 585, 296);
  ctx.lineTo(610, 295);
  ctx.bezierCurveTo(628, 235, 644, 165, 648, 98);
  ctx.lineTo(615, 100);
  ctx.closePath();
}

const LOBE_PATHS = {
  frontal: pathFrontal,
  parietal: pathParietal,
  occipital: pathOccipital,
  temporal: pathTemporal,
  motor: pathMotor,
};

// Anatomical cerebrum — silhouette + cortex base + sulci + gyri.
function drawCerebrumAnatomy(ctx, opts = {}) {
  const alpha = opts.alpha != null ? opts.alpha : 1;
  ctx.save();
  ctx.globalAlpha = alpha;

  // Soft outer halo
  const halo = ctx.createRadialGradient(740, 280, 100, 740, 280, 480);
  halo.addColorStop(0, 'rgba(212, 160, 148, 0.10)');
  halo.addColorStop(1, 'rgba(212, 160, 148, 0)');
  ctx.fillStyle = halo;
  ctx.beginPath();
  ctx.arc(740, 280, 480, 0, Math.PI * 2);
  ctx.fill();

  // Outer cerebrum silhouette (single closed path that matches the lobe boundaries)
  ctx.beginPath();
  ctx.moveTo(430, 175);
  ctx.bezierCurveTo(440, 130, 510, 95, 590, 92);
  ctx.bezierCurveTo(720, 80, 815, 80, 893, 105);
  ctx.bezierCurveTo(980, 130, 1045, 180, 1070, 240);
  ctx.bezierCurveTo(1082, 290, 1070, 350, 1042, 392);
  ctx.bezierCurveTo(1010, 400, 970, 392, 945, 378);
  ctx.bezierCurveTo(905, 425, 845, 462, 780, 470);
  ctx.bezierCurveTo(680, 472, 580, 462, 500, 440);
  ctx.bezierCurveTo(450, 422, 425, 385, 425, 350);
  ctx.bezierCurveTo(420, 295, 415, 225, 430, 175);
  ctx.closePath();

  // Cortex base fill (warm pink-tan, anatomical)
  const cortex = ctx.createRadialGradient(680, 230, 80, 720, 280, 420);
  cortex.addColorStop(0, 'rgba(248, 217, 206, 0.95)');
  cortex.addColorStop(0.55, 'rgba(212, 154, 141, 0.92)');
  cortex.addColorStop(1, 'rgba(140, 80, 65, 0.88)');
  ctx.fillStyle = cortex;
  ctx.fill();

  // Outer outline
  ctx.strokeStyle = 'rgba(115, 60, 48, 0.65)';
  ctx.lineWidth = 1.8;
  ctx.stroke();

  // Top sheen
  ctx.strokeStyle = 'rgba(255, 230, 215, 0.4)';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(450, 142);
  ctx.bezierCurveTo(560, 102, 720, 86, 870, 96);
  ctx.stroke();

  // Sulci — anatomical dividing fissures
  ctx.lineCap = 'round';

  // Central sulcus (frontal | parietal)
  ctx.strokeStyle = 'rgba(110, 55, 42, 0.7)';
  ctx.lineWidth = 2.4;
  ctx.beginPath();
  ctx.moveTo(648, 98);
  ctx.bezierCurveTo(644, 165, 628, 235, 610, 295);
  ctx.stroke();
  // soft shadow above central sulcus
  ctx.strokeStyle = 'rgba(255, 220, 200, 0.30)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(652, 98);
  ctx.bezierCurveTo(648, 165, 632, 235, 614, 295);
  ctx.stroke();

  // Lateral (Sylvian) fissure (temporal | rest)
  ctx.strokeStyle = 'rgba(110, 55, 42, 0.7)';
  ctx.lineWidth = 2.4;
  ctx.beginPath();
  ctx.moveTo(445, 295);
  ctx.bezierCurveTo(560, 305, 720, 300, 830, 290);
  ctx.bezierCurveTo(870, 282, 900, 270, 945, 282);
  ctx.stroke();

  // Parieto-occipital sulcus (parietal | occipital)
  ctx.strokeStyle = 'rgba(110, 55, 42, 0.6)';
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.moveTo(895, 105);
  ctx.bezierCurveTo(902, 165, 906, 220, 908, 260);
  ctx.stroke();

  // Gyri texture across lobes — subtle wavy lines giving the brain its surface look
  ctx.strokeStyle = 'rgba(115, 60, 48, 0.32)';
  ctx.lineWidth = 0.9;
  const gyri = [
    // frontal lobe
    [443, 198, 510, 195, 580, 200],
    [445, 232, 510, 232, 580, 230],
    [450, 262, 525, 264, 585, 260],
    // parietal lobe
    [680, 130, 770, 122, 870, 130],
    [685, 170, 775, 165, 875, 175],
    [695, 212, 785, 210, 880, 222],
    [710, 250, 800, 252, 895, 252],
    // occipital lobe
    [920, 165, 980, 195, 1025, 235],
    [935, 215, 998, 252, 1040, 300],
    [945, 270, 1005, 312, 1042, 358],
    // temporal lobe
    [478, 358, 580, 376, 680, 396],
    [495, 398, 600, 418, 720, 432],
    [540, 432, 645, 452, 760, 458],
    [690, 458, 800, 458, 880, 438],
  ];
  gyri.forEach(g => {
    ctx.beginPath();
    ctx.moveTo(g[0], g[1]);
    ctx.quadraticCurveTo(g[2], g[3], g[4], g[5]);
    ctx.stroke();
  });

  ctx.restore();
}

// Lobe activation overlay — colored tint inside lobe polygon.
function drawLobeActivation(ctx, key, activation, t, highlight) {
  const fn = LOBE_PATHS[key];
  if (!fn) return;
  if (activation < 0.05 && (highlight || 0) < 0.05) return;
  const r = REGIONS[key];
  const color = r.color;
  ctx.save();
  ctx.lineJoin = 'round';
  // Soft shadow halo when active
  if (activation > 0.15) {
    ctx.shadowBlur = 22 * activation;
    ctx.shadowColor = rgba(color, 0.55);
  }
  // Fill the lobe polygon
  fn(ctx);
  const fillA = activation * 0.42 + (highlight || 0) * 0.20;
  ctx.fillStyle = rgba(color, fillA);
  ctx.fill();
  ctx.shadowBlur = 0;
  // Pulse stroke along the lobe outline
  fn(ctx);
  ctx.strokeStyle = rgba(color, 0.40 + activation * 0.4);
  ctx.lineWidth = 1.6 + activation * 1.2;
  ctx.stroke();
  // Breathing glow stroke
  if (activation > 0.15) {
    const pulse = (Math.sin((t || 0) / 350 + r.x * 0.01) + 1) * 0.5;
    fn(ctx);
    ctx.strokeStyle = rgba(color, (0.20 + pulse * 0.3) * activation);
    ctx.lineWidth = 5;
    ctx.stroke();
  }
  ctx.restore();
}

// Deep-structure drawers (subcortical anatomical shapes).
function drawDeepPulse(ctx, r, activation, t, radius) {
  if (activation < 0.1) return;
  const phase = ((t || 0) / 600 + r.x * 0.005) % 1;
  const a = (1 - phase) * 0.5 * activation;
  ctx.strokeStyle = rgba(r.color, a);
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.arc(r.x, r.y, radius + phase * 14, 0, Math.PI * 2);
  ctx.stroke();
}

function drawThalamus(ctx, activation, t) {
  const r = REGIONS.thalamus;
  ctx.save();
  // Egg-shaped, tilted forward — sits at the center of the brain
  const a = 0.55 + activation * 0.4;
  const grad = ctx.createRadialGradient(r.x - 9, r.y - 7, 0, r.x, r.y, 30);
  grad.addColorStop(0, rgba('#ede9fe', a));
  grad.addColorStop(0.55, rgba(r.color, a));
  grad.addColorStop(1, rgba('#5b21b6', a));
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.ellipse(r.x, r.y, 28, 19, -0.18, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = rgba('#4c1d95', 0.65);
  ctx.lineWidth = 1.3;
  ctx.stroke();
  // Inner specular
  ctx.fillStyle = rgba('#ffffff', 0.28);
  ctx.beginPath();
  ctx.ellipse(r.x - 8, r.y - 6, 8, 5, -0.18, 0, Math.PI * 2);
  ctx.fill();
  drawDeepPulse(ctx, r, activation, t, 32);
  ctx.restore();
}

function drawHypothalamus(ctx, activation, t) {

function drawHippocampus(ctx, activation, t) {
  const r = REGIONS.hippocampus;
  ctx.save();
  // Seahorse-curl tube — characteristic hippocampal shape
  const a = 0.7 + activation * 0.3;
  ctx.strokeStyle = rgba(r.color, a);
  ctx.lineCap = 'round';
  ctx.lineWidth = 11;
  ctx.beginPath();
  ctx.moveTo(r.x - 20, r.y + 7);
  ctx.bezierCurveTo(r.x - 14, r.y - 8, r.x + 6, r.y - 12, r.x + 14, r.y - 3);
  ctx.bezierCurveTo(r.x + 20, r.y + 5, r.x + 16, r.y + 11, r.x + 8, r.y + 9);

  ctx.strokeStyle = rgba('#fef3c7', 0.65);
  ctx.lineWidth = 3.5;
  ctx.beginPath();
  ctx.moveTo(r.x - 18, r.y + 5);
  ctx.bezierCurveTo(r.x - 12, r.y - 6, r.x + 4, r.y - 10, r.x + 12, r.y - 2);
  ctx.stroke();
  // outline
  ctx.strokeStyle = 'rgba(120, 80, 20, 0.55)';
  ctx.lineWidth = 1.3;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(r.x - 20, r.y + 7);
  ctx.bezierCurveTo(r.x - 14, r.y - 8, r.x + 6, r.y - 12, r.x + 14, r.y - 3);
  ctx.bezierCurveTo(r.x + 20, r.y + 5, r.x + 16, r.y + 11, r.x + 8, r.y + 9);

  ctx.restore();
}

function drawBasalGanglia(ctx, activation, t) {

// Cerebellum — anatomical lateral view with dense folia.
function drawCerebellum(ctx, activation, t) {
  const r = REGIONS.cerebellum;
  ctx.save();
  // Halo when active
  if (activation > 0.05) {
    const halo = ctx.createRadialGradient(r.x, r.y, 0, r.x, r.y, 95);
    halo.addColorStop(0, rgba(r.color, 0.25 * activation));
    halo.addColorStop(1, rgba(r.color, 0));
    ctx.fillStyle = halo;
    ctx.beginPath();
    ctx.arc(r.x, r.y, 95, 0, Math.PI * 2);
    ctx.fill();
  }
  // Body — slightly oval, sized to match real cerebellum proportions in sagittal view
  // Use clipping so folia stay inside the body
  ctx.save();
  ctx.beginPath();
  ctx.ellipse(r.x, r.y, 56, 44, 0.04, 0, Math.PI * 2);
  ctx.clip();
  // Base gradient — pink-tan like cerebrum but slightly darker
  const grad = ctx.createLinearGradient(r.x, r.y - 50, r.x, r.y + 50);
  grad.addColorStop(0, '#dfa898');
  grad.addColorStop(0.4, '#c08a7a');
  grad.addColorStop(1, '#7a4a3c');
  ctx.fillStyle = grad;
  ctx.fillRect(r.x - 70, r.y - 60, 140, 120);
  // Dense parallel folia — many thin curved lines, characteristic of cerebellum
  // Slight downward curve (matches the medical-textbook foliate pattern)
  ctx.strokeStyle = 'rgba(80, 40, 30, 0.55)';
  ctx.lineWidth = 0.9;
  for (let i = -20; i <= 20; i++) {
    const yy = r.y + i * 2.6;
    // Each fold gently curves
    ctx.beginPath();
    ctx.moveTo(r.x - 60, yy);
    ctx.quadraticCurveTo(r.x, yy + 1.5, r.x + 60, yy);
    ctx.stroke();
  }
  // Slightly darker "interlobular" shadow lines every 5th fold for depth
  ctx.strokeStyle = 'rgba(60, 28, 22, 0.7)';
  ctx.lineWidth = 1.2;
  for (let i = -16; i <= 16; i += 4) {
    const yy = r.y + i * 2.6;
    ctx.beginPath();
    ctx.moveTo(r.x - 60, yy);
    ctx.quadraticCurveTo(r.x, yy + 1.5, r.x + 60, yy);
    ctx.stroke();
  }
  // Activation color tint
  if (activation > 0.05) {
    ctx.fillStyle = rgba(r.color, 0.18 * activation);
    ctx.fillRect(r.x - 70, r.y - 60, 140, 120);
  }
  ctx.restore();
  // Outer rim outline
  ctx.strokeStyle = 'rgba(85, 42, 32, 0.75)';
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.ellipse(r.x, r.y, 56, 44, 0.04, 0, Math.PI * 2);
  ctx.stroke();
  // Subtle top-left highlight (anatomical sheen)
  ctx.strokeStyle = 'rgba(255, 220, 205, 0.28)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.ellipse(r.x - 4, r.y - 6, 50, 38, 0.04, Math.PI * 1.0, Math.PI * 1.6);
  ctx.stroke();
  // Activation pulse ring
  if (activation > 0.1) {
    const phase = ((t || 0) / 600 + r.x * 0.005) % 1;
    ctx.strokeStyle = rgba(r.color, (1 - phase) * 0.45 * activation);
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.ellipse(r.x, r.y, 56 + phase * 14, 44 + phase * 11, 0.04, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.restore();
}

// Brain stem — 3-segment tube (midbrain, pons, medulla).
function drawBrainStem(ctx, activation, t) {
  const r = REGIONS.brainstem;
  const cx = r.x;
  const topY = 432;
  const botY = 555;
  ctx.save();
  // Halo
  if (activation > 0.05) {
    const halo = ctx.createRadialGradient(cx, (topY + botY) / 2, 0, cx, (topY + botY) / 2, 70);
    halo.addColorStop(0, rgba(r.color, 0.30 * activation));
    halo.addColorStop(1, rgba(r.color, 0));
    ctx.fillStyle = halo;
    ctx.beginPath();
    ctx.arc(cx, (topY + botY) / 2, 70, 0, Math.PI * 2);
    ctx.fill();
  }
  // Body — narrow at top (midbrain), wider in middle (pons), tapers (medulla)
  const grad = ctx.createLinearGradient(cx - 28, 0, cx + 28, 0);
  grad.addColorStop(0, '#a06250');
  grad.addColorStop(0.5, '#d49a8d');
  grad.addColorStop(1, '#7c4234');
  ctx.fillStyle = grad;
  ctx.beginPath();
  // outline of brain stem tube
  ctx.moveTo(cx - 16, topY);
  ctx.bezierCurveTo(cx - 22, topY + 22, cx - 26, topY + 45, cx - 24, topY + 60);  // midbrain narrowing
  ctx.bezierCurveTo(cx - 32, topY + 75, cx - 32, topY + 92, cx - 24, topY + 105); // pons bulge
  ctx.bezierCurveTo(cx - 18, botY - 12, cx - 14, botY - 4, cx - 12, botY);         // medulla taper
  ctx.lineTo(cx + 12, botY);
  ctx.bezierCurveTo(cx + 14, botY - 4, cx + 18, botY - 12, cx + 24, topY + 105);
  ctx.bezierCurveTo(cx + 32, topY + 92, cx + 32, topY + 75, cx + 24, topY + 60);
  ctx.bezierCurveTo(cx + 26, topY + 45, cx + 22, topY + 22, cx + 16, topY);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = 'rgba(75, 35, 28, 0.65)';
  ctx.lineWidth = 1.4;
  ctx.stroke();
  // Segment dividers (midbrain / pons / medulla)
  ctx.strokeStyle = 'rgba(75, 35, 28, 0.35)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(cx - 24, topY + 60);
  ctx.lineTo(cx + 24, topY + 60);
  ctx.moveTo(cx - 28, topY + 105);
  ctx.lineTo(cx + 28, topY + 105);
  ctx.stroke();
  // Top highlight along left edge
  ctx.strokeStyle = 'rgba(255, 220, 205, 0.30)';
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.moveTo(cx - 12, topY + 5);
  ctx.bezierCurveTo(cx - 18, topY + 30, cx - 26, topY + 78, cx - 9, botY - 10);
  ctx.stroke();
  // Activation overlay
  if (activation > 0.05) {
    ctx.fillStyle = rgba(r.color, 0.22 * activation);
    ctx.beginPath();
    ctx.moveTo(cx - 16, topY);
    ctx.bezierCurveTo(cx - 22, topY + 22, cx - 26, topY + 45, cx - 24, topY + 60);
    ctx.bezierCurveTo(cx - 32, topY + 75, cx - 32, topY + 92, cx - 24, topY + 105);
    ctx.bezierCurveTo(cx - 18, botY - 12, cx - 14, botY - 4, cx - 12, botY);
    ctx.lineTo(cx + 12, botY);
    ctx.bezierCurveTo(cx + 14, botY - 4, cx + 18, botY - 12, cx + 24, topY + 105);
    ctx.bezierCurveTo(cx + 32, topY + 92, cx + 32, topY + 75, cx + 24, topY + 60);
    ctx.bezierCurveTo(cx + 26, topY + 45, cx + 22, topY + 22, cx + 16, topY);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}

// Region dispatcher — calls the right anatomical drawer.
function drawRegion(ctx, key, opts = {}) {
  const r = REGIONS[key];
  if (!r) return;
  const t = opts.t || 0;
  const active = opts.active || 0;
  const highlight = opts.highlight || 0;
  if (r.kind === 'lobe') {
    drawLobeActivation(ctx, key, active, t, highlight);
  } else if (r.kind === 'deep') {
    const a = Math.max(active, (highlight || 0) * 0.4);
    if (key === 'thalamus') drawThalamus(ctx, a, t);
    else if (key === 'hypothalamus') drawHypothalamus(ctx, a, t);
    else if (key === 'hippocampus') drawHippocampus(ctx, a, t);
    else if (key === 'amygdala') drawAmygdala(ctx, a, t);
    else if (key === 'accumbens') drawAccumbens(ctx, a, t);
    else if (key === 'basalganglia') drawBasalGanglia(ctx, a, t);
  } else if (r.kind === 'cerebellum') {
    drawCerebellum(ctx, Math.max(active, (highlight || 0) * 0.4), t);
  } else if (r.kind === 'brainstem') {
    drawBrainStem(ctx, Math.max(active, (highlight || 0) * 0.4), t);
  }
}

// Spinal cord — vertical tube descending from brain stem.
function drawSpinalCord(ctx, activation, t) {
  const n = OUTPUTS.spinal;
  ctx.save();
  const sx = 885, sy = 552;
  const ex = n.x, ey = n.y;
  // tube
  const grad = ctx.createLinearGradient(0, sy, 0, ey + 10);
  grad.addColorStop(0, '#a06250');
  grad.addColorStop(0.5, '#b8967f');
  grad.addColorStop(1, '#7c4234');
  ctx.strokeStyle = grad;
  ctx.lineWidth = 22;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(sx, sy);
  ctx.bezierCurveTo(sx + 30, sy + 10, ex - 90, ey - 8, ex, ey);
  ctx.stroke();
  // Inner highlight
  ctx.strokeStyle = 'rgba(255, 220, 205, 0.30)';
  ctx.lineWidth = 3.5;
  ctx.beginPath();
  ctx.moveTo(sx, sy - 8);
  ctx.bezierCurveTo(sx + 30, sy + 2, ex - 90, ey - 16, ex, ey - 7);
  ctx.stroke();
  // Vertebral disc hints — ticks across the cord
  ctx.strokeStyle = 'rgba(60, 30, 22, 0.55)';
  ctx.lineWidth = 1.4;
  const segs = 7;
  for (let i = 1; i < segs; i++) {
    const tt = i / segs;
    // approximate point along the bezier
    const u = 1 - tt;
    const c1x = sx + 30, c1y = sy + 10;
    const c2x = ex - 90, c2y = ey - 8;
    const px = u*u*u*sx + 3*u*u*tt*c1x + 3*u*tt*tt*c2x + tt*tt*tt*ex;
    const py = u*u*u*sy + 3*u*u*tt*c1y + 3*u*tt*tt*c2y + tt*tt*tt*ey;
    // tangent direction
    const tanX = 3*u*u*(c1x - sx) + 6*u*tt*(c2x - c1x) + 3*tt*tt*(ex - c2x);
    const tanY = 3*u*u*(c1y - sy) + 6*u*tt*(c2y - c1y) + 3*tt*tt*(ey - c2y);
    const mag = Math.hypot(tanX, tanY);
    const nx = -tanY / mag, ny = tanX / mag;
    ctx.beginPath();
    ctx.moveTo(px - nx * 12, py - ny * 12);
    ctx.lineTo(px + nx * 12, py + ny * 12);
    ctx.stroke();
  }
  // End cap bulb
  const cap = ctx.createRadialGradient(ex - 6, ey - 6, 0, ex, ey, 22);
  cap.addColorStop(0, '#f8d9ce');
  cap.addColorStop(0.55, '#c8957f');
  cap.addColorStop(1, '#7c4234');
  ctx.fillStyle = cap;
  ctx.beginPath();
  ctx.arc(ex, ey, 20, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = 'rgba(75, 35, 28, 0.55)';
  ctx.lineWidth = 1.3;
  ctx.stroke();
  // Activation pulse
  if (activation > 0.05) {
    const halo = ctx.createRadialGradient(ex, ey, 0, ex, ey, 38);
    halo.addColorStop(0, rgba(n.color, 0.45 * activation));
    halo.addColorStop(1, rgba(n.color, 0));
    ctx.fillStyle = halo;
    ctx.beginPath();
    ctx.arc(ex, ey, 38, 0, Math.PI * 2);
    ctx.fill();
    const phase = ((t || 0) / 480) % 1;
    ctx.strokeStyle = rgba(n.color, (1 - phase) * 0.55 * activation);
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(ex, ey, 24 + phase * 18, 0, Math.PI * 2);
    ctx.stroke();
  }
  // Label
  ctx.fillStyle = rgba(n.color, 0.95);
  ctx.font = '600 12px -apple-system, system-ui';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('Spinal Cord', ex, ey + 36);
  ctx.restore();
}

// Sensory organs — anatomical illustrations.
function drawEye(ctx, opts = {}) {
  const n = INPUTS.eye;
  const t = opts.t || 0;
  const active = opts.active || 0;
  const cx = n.x, cy = n.y;
  ctx.save();
  if (active > 0.05) {
    const halo = ctx.createRadialGradient(cx, cy, 0, cx, cy, 60);
    halo.addColorStop(0, rgba(n.color, 0.4 * active));
    halo.addColorStop(1, rgba(n.color, 0));
    ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(cx, cy, 60, 0, Math.PI * 2); ctx.fill();
  }
  // Eyelid arcs (subtle anatomical hint)
  ctx.strokeStyle = 'rgba(155, 95, 80, 0.55)';
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.moveTo(cx - 32, cy);
  ctx.quadraticCurveTo(cx + 2, cy - 22, cx + 32, cy);
  ctx.quadraticCurveTo(cx + 2, cy + 22, cx - 32, cy);
  ctx.stroke();
  // Sclera (white)
  const sclera = ctx.createRadialGradient(cx - 5, cy - 4, 0, cx, cy, 30);
  sclera.addColorStop(0, '#ffffff');
  sclera.addColorStop(0.85, '#f0f4ff');
  sclera.addColorStop(1, '#c7d2fe');
  ctx.fillStyle = sclera;
  ctx.beginPath();
  ctx.ellipse(cx, cy, 30, 19, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = 'rgba(99, 102, 241, 0.45)';
  ctx.lineWidth = 1;
  ctx.stroke();
  // Iris
  const iris = ctx.createRadialGradient(cx + 3, cy - 2, 0, cx + 6, cy, 13);
  iris.addColorStop(0, '#c4b5fd');
  iris.addColorStop(0.55, '#7c3aed');
  iris.addColorStop(1, '#2e1065');
  ctx.fillStyle = iris;
  ctx.beginPath();
  ctx.arc(cx + 6, cy, 12, 0, Math.PI * 2);
  ctx.fill();
  // Pupil
  ctx.fillStyle = '#0a0a0a';
  ctx.beginPath();
  ctx.arc(cx + 6, cy, 5.5, 0, Math.PI * 2);
  ctx.fill();
  // Catchlight
  ctx.fillStyle = 'rgba(255, 255, 255, 0.92)';
  ctx.beginPath();
  ctx.arc(cx + 3, cy - 2, 1.8, 0, Math.PI * 2);
  ctx.fill();
  // Optic nerve exiting back of eye
  ctx.strokeStyle = rgba(n.color, 0.7);
  ctx.lineWidth = 7;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(cx + 24, cy + 4);
  ctx.quadraticCurveTo(cx + 52, cy + 14, cx + 72, cy + 4);
  ctx.stroke();
  // Active signal pulse along optic nerve
  if (active > 0.1) {
    const ph = ((t || 0) / 380) % 1;
    const px = cx + 24 + ph * 48;
    const py = cy + 4 + Math.sin(ph * Math.PI) * 8;
    const g = ctx.createRadialGradient(px, py, 0, px, py, 14);
    g.addColorStop(0, 'rgba(255,255,255,0.9)');
    g.addColorStop(0.4, rgba(n.color, 0.85));
    g.addColorStop(1, rgba(n.color, 0));
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(px, py, 14, 0, Math.PI * 2); ctx.fill();
  }
  ctx.fillStyle = rgba(n.color, 0.95);
  ctx.font = '600 12px -apple-system, system-ui';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('Eye', cx, cy + 40);
  ctx.restore();
}

function drawEar(ctx, opts = {}) {
  const n = INPUTS.ear;
  const t = opts.t || 0;
  const active = opts.active || 0;
  const cx = n.x, cy = n.y;
  ctx.save();
  if (active > 0.05) {
    const halo = ctx.createRadialGradient(cx, cy, 0, cx, cy, 55);
    halo.addColorStop(0, rgba(n.color, 0.35 * active));
    halo.addColorStop(1, rgba(n.color, 0));
    ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(cx, cy, 55, 0, Math.PI * 2); ctx.fill();
  }
  // Outer ear shape (kidney-like with helix curl)
  const earFill = ctx.createRadialGradient(cx - 6, cy - 8, 0, cx, cy, 32);
  earFill.addColorStop(0, '#f8d9ce');
  earFill.addColorStop(0.55, '#d49a8d');
  earFill.addColorStop(1, '#8c4d3e');
  ctx.fillStyle = earFill;
  ctx.beginPath();
  ctx.moveTo(cx - 2, cy - 26);
  ctx.bezierCurveTo(cx + 20, cy - 28, cx + 28, cy - 5, cx + 22, cy + 14);
  ctx.bezierCurveTo(cx + 16, cy + 28, cx + 4, cy + 30, cx - 8, cy + 24);
  ctx.bezierCurveTo(cx - 20, cy + 16, cx - 26, cy + 0, cx - 22, cy - 14);
  ctx.bezierCurveTo(cx - 18, cy - 24, cx - 10, cy - 27, cx - 2, cy - 26);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = 'rgba(115, 60, 48, 0.65)';
  ctx.lineWidth = 1.4;
  ctx.stroke();
  // Inner helix curl
  ctx.strokeStyle = 'rgba(115, 60, 48, 0.55)';
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.moveTo(cx, cy - 18);
  ctx.bezierCurveTo(cx + 14, cy - 18, cx + 18, cy - 4, cx + 16, cy + 6);
  ctx.bezierCurveTo(cx + 12, cy + 16, cx + 2, cy + 18, cx - 4, cy + 14);
  ctx.stroke();
  // Tragus (small inner bump)
  ctx.fillStyle = 'rgba(115, 60, 48, 0.5)';
  ctx.beginPath();
  ctx.ellipse(cx - 6, cy + 4, 4, 6, 0.1, 0, Math.PI * 2);
  ctx.fill();
  // Ear canal
  ctx.fillStyle = 'rgba(40, 16, 12, 0.85)';
  ctx.beginPath();
  ctx.ellipse(cx + 4, cy + 2, 5, 7, -0.1, 0, Math.PI * 2);
  ctx.fill();
  // Sound wave arcs to the left (incoming sound)
  if (active > 0.1) {
    const ph = ((t || 0) / 500) % 1;
    for (let i = 0; i < 3; i++) {
      const a2 = (1 - ((ph + i * 0.33) % 1)) * 0.7 * active;
      ctx.strokeStyle = rgba(n.color, a2);
      ctx.lineWidth = 2;
      const rad = 30 + ((ph + i * 0.33) % 1) * 24;
      ctx.beginPath();
      ctx.arc(cx - 22, cy, rad, -Math.PI * 0.35, Math.PI * 0.35);
      ctx.stroke();
    }
  }
  // Auditory nerve exiting back
  ctx.strokeStyle = rgba(n.color, 0.7);
  ctx.lineWidth = 6;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(cx + 24, cy + 5);
  ctx.quadraticCurveTo(cx + 52, cy + 12, cx + 72, cy);
  ctx.stroke();
  if (active > 0.1) {
    const ph = ((t || 0) / 380) % 1;
    const px = cx + 24 + ph * 48;
    const py = cy + 5 + Math.sin(ph * Math.PI) * 8;
    const g = ctx.createRadialGradient(px, py, 0, px, py, 12);
    g.addColorStop(0, 'rgba(255,255,255,0.9)');
    g.addColorStop(0.4, rgba(n.color, 0.8));
    g.addColorStop(1, rgba(n.color, 0));
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(px, py, 12, 0, Math.PI * 2); ctx.fill();
  }
  ctx.fillStyle = rgba(n.color, 0.95);
  ctx.font = '600 12px -apple-system, system-ui';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('Ear', cx, cy + 44);
  ctx.restore();
}

function drawNose(ctx, opts = {}) {
  const n = INPUTS.nose;
  const t = opts.t || 0;
  const active = opts.active || 0;
  const cx = n.x, cy = n.y;
  ctx.save();
  if (active > 0.05) {
    const halo = ctx.createRadialGradient(cx, cy, 0, cx, cy, 55);
    halo.addColorStop(0, rgba(n.color, 0.35 * active));
    halo.addColorStop(1, rgba(n.color, 0));
    ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(cx, cy, 55, 0, Math.PI * 2); ctx.fill();
  }
  // Side-view nose profile (facing right toward brain)
  const noseFill = ctx.createRadialGradient(cx - 4, cy - 8, 0, cx, cy, 32);
  noseFill.addColorStop(0, '#f8d9ce');
  noseFill.addColorStop(0.55, '#d49a8d');
  noseFill.addColorStop(1, '#8c4d3e');
  ctx.fillStyle = noseFill;
  ctx.beginPath();
  // Bridge to tip
  ctx.moveTo(cx - 16, cy - 26);
  ctx.bezierCurveTo(cx - 8, cy - 28, cx + 4, cy - 20, cx + 14, cy - 6);   // bridge then tip
  ctx.bezierCurveTo(cx + 18, cy + 4, cx + 18, cy + 12, cx + 12, cy + 16); // tip to under
  ctx.bezierCurveTo(cx + 4, cy + 20, cx - 8, cy + 22, cx - 14, cy + 18);  // nostril region
  ctx.bezierCurveTo(cx - 20, cy + 10, cx - 22, cy - 6, cx - 20, cy - 18); // back of nose
  ctx.bezierCurveTo(cx - 20, cy - 24, cx - 18, cy - 26, cx - 16, cy - 26);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = 'rgba(115, 60, 48, 0.65)';
  ctx.lineWidth = 1.4;
  ctx.stroke();
  // Nostril
  ctx.fillStyle = 'rgba(40, 16, 12, 0.85)';
  ctx.beginPath();
  ctx.ellipse(cx + 2, cy + 12, 4.5, 2.8, -0.18, 0, Math.PI * 2);
  ctx.fill();
  // Olfactory bulb (small purple ellipse where nerve enters skull)
  const bulb = ctx.createRadialGradient(cx + 12, cy - 18, 0, cx + 12, cy - 18, 11);
  bulb.addColorStop(0, rgba(n.color, 0.95));
  bulb.addColorStop(1, '#831843');
  ctx.fillStyle = bulb;
  ctx.beginPath();
  ctx.ellipse(cx + 14, cy - 18, 10, 5.5, -0.2, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = rgba(n.color, 0.85);
  ctx.lineWidth = 1.1;
  ctx.stroke();
  // Olfactory nerve to brain
  ctx.strokeStyle = rgba(n.color, 0.7);
  ctx.lineWidth = 5;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(cx + 24, cy - 18);
  ctx.quadraticCurveTo(cx + 52, cy - 10, cx + 72, cy - 4);
  ctx.stroke();
  // Smell particles drifting toward nose when active
  if (active > 0.1) {
    for (let i = 0; i < 5; i++) {
      const ph = ((t || 0) / 400 + i * 0.2) % 1;
      const px = cx - 36 + ph * 24;
      const py = cy - 10 + Math.sin(ph * Math.PI * 2 + i) * 4;
      const a2 = (1 - Math.abs(ph - 0.5) * 2) * 0.7 * active;
      ctx.fillStyle = rgba(n.color, a2);
      ctx.beginPath();
      ctx.arc(px, py, 2.2, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.fillStyle = rgba(n.color, 0.95);
  ctx.font = '600 12px -apple-system, system-ui';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('Nose', cx, cy + 38);
  ctx.restore();
}

function drawHand(ctx, opts = {}) {
  const n = INPUTS.skin;
  const t = opts.t || 0;
  const active = opts.active || 0;
  const cx = n.x, cy = n.y;
  ctx.save();
  if (active > 0.05) {
    const halo = ctx.createRadialGradient(cx, cy, 0, cx, cy, 60);
    halo.addColorStop(0, rgba(n.color, 0.35 * active));
    halo.addColorStop(1, rgba(n.color, 0));
    ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(cx, cy, 60, 0, Math.PI * 2); ctx.fill();
  }
  // Hand silhouette: palm with extended index finger pointing right
  const handFill = ctx.createRadialGradient(cx - 10, cy - 10, 0, cx, cy, 38);
  handFill.addColorStop(0, '#f8d9ce');
  handFill.addColorStop(0.5, '#d49a8d');
  handFill.addColorStop(1, '#8c4d3e');
  ctx.fillStyle = handFill;
  ctx.strokeStyle = 'rgba(115, 60, 48, 0.6)';
  ctx.lineWidth = 1.3;
  // palm
  ctx.beginPath();
  ctx.ellipse(cx - 8, cy + 4, 18, 22, 0.05, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  // thumb
  ctx.beginPath();
  ctx.ellipse(cx - 18, cy - 12, 6, 11, -0.55, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  // index finger (extended right, pointing toward brain)
  ctx.beginPath();
  ctx.ellipse(cx + 10, cy - 9, 20, 7, 0.05, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  // middle finger (shorter)
  ctx.beginPath();
  ctx.ellipse(cx + 4, cy + 1, 16, 6.5, 0.05, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  // ring finger
  ctx.beginPath();
  ctx.ellipse(cx + 2, cy + 11, 14, 6, 0.08, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  // little finger
  ctx.beginPath();
  ctx.ellipse(cx - 2, cy + 20, 11, 5, 0.1, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  // Fingertip touch sparkle when active
  if (active > 0.1) {
    const ph = ((t || 0) / 400) % 1;
    const tipX = cx + 28;
    const tipY = cy - 9;
    const g = ctx.createRadialGradient(tipX, tipY, 0, tipX, tipY, 16);
    g.addColorStop(0, 'rgba(255,255,255,0.95)');
    g.addColorStop(0.4, rgba(n.color, 0.85));
    g.addColorStop(1, rgba(n.color, 0));
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(tipX, tipY, 12 + ph * 5, 0, Math.PI * 2); ctx.fill();
  }
  // Sensory nerve to brain (from wrist)
  ctx.strokeStyle = rgba(n.color, 0.7);
  ctx.lineWidth = 6;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(cx + 22, cy + 22);
  ctx.quadraticCurveTo(cx + 50, cy + 20, cx + 72, cy + 14);
  ctx.stroke();
  ctx.fillStyle = rgba(n.color, 0.95);
  ctx.font = '600 12px -apple-system, system-ui';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('Skin / Touch', cx, cy + 50);
  ctx.restore();
}

// Body outputs — anatomical illustrations.
function drawMuscle(ctx, opts = {}) {
  const n = OUTPUTS.muscle;
  const t = opts.t || 0;
  const active = opts.active || 0;
  const cx = n.x, cy = n.y;
  ctx.save();
  if (active > 0.05) {
    const halo = ctx.createRadialGradient(cx, cy, 0, cx, cy, 70);
    halo.addColorStop(0, rgba(n.color, 0.4 * active));
    halo.addColorStop(1, rgba(n.color, 0));
    ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(cx, cy, 70, 0, Math.PI * 2); ctx.fill();
  }
  // Muscle contraction when active (squash)
  const flex = active > 0.1 ? Math.sin((t || 0) / 200) * 0.08 * active : 0;
  // Muscle bundle — fusiform shape with diagonal striations
  const fill = ctx.createRadialGradient(cx - 8, cy - 10, 0, cx, cy, 44);
  fill.addColorStop(0, '#f8c9b8');
  fill.addColorStop(0.5, '#ce6f5c');
  fill.addColorStop(1, '#7a2e1e');
  ctx.fillStyle = fill;
  ctx.beginPath();
  ctx.ellipse(cx, cy, 38 + flex * 16, 26 - flex * 14, -0.22, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = 'rgba(95, 30, 22, 0.65)';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  // Striations (diagonal fibers)
  ctx.strokeStyle = 'rgba(95, 30, 22, 0.45)';
  ctx.lineWidth = 1;
  for (let i = -4; i <= 4; i++) {
    const off = i * 6;
    ctx.beginPath();
    ctx.moveTo(cx + off - 25, cy + 20);
    ctx.lineTo(cx + off + 14, cy - 20);
    ctx.stroke();
  }
  // Tendons (tapered ends)
  ctx.fillStyle = '#d4b8a8';
  ctx.beginPath();
  ctx.ellipse(cx - 38, cy + 7, 10, 6, -0.22, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = 'rgba(95, 30, 22, 0.45)';
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.beginPath();
  ctx.fillStyle = '#d4b8a8';
  ctx.ellipse(cx + 38, cy - 7, 10, 6, -0.22, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  // Label
  ctx.fillStyle = rgba(n.color, 0.95);
  ctx.font = '600 12px -apple-system, system-ui';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('Muscle', cx, cy + 46);
  ctx.restore();
}

function drawGland(ctx, opts = {}) {
  const n = OUTPUTS.gland;
  const t = opts.t || 0;
  const active = opts.active || 0;
  const cx = n.x, cy = n.y;
  ctx.save();
  if (active > 0.05) {
    const halo = ctx.createRadialGradient(cx, cy, 0, cx, cy, 60);
    halo.addColorStop(0, rgba(n.color, 0.35 * active));
    halo.addColorStop(1, rgba(n.color, 0));
    ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(cx, cy, 60, 0, Math.PI * 2); ctx.fill();
  }
  // Kidney behind (anatomical context — adrenals sit on top of kidneys)
  const kidneyFill = ctx.createRadialGradient(cx - 4, cy + 10, 0, cx, cy + 14, 34);
  kidneyFill.addColorStop(0, '#b08070');
  kidneyFill.addColorStop(0.6, '#8a4f3e');
  kidneyFill.addColorStop(1, '#4a2218');
  ctx.fillStyle = kidneyFill;
  ctx.beginPath();
  // kidney bean shape (medial concavity facing left)
  ctx.moveTo(cx + 22, cy + 4);
  ctx.bezierCurveTo(cx + 28, cy + 22, cx + 14, cy + 32, cx, cy + 32);
  ctx.bezierCurveTo(cx - 12, cy + 32, cx - 26, cy + 22, cx - 22, cy + 6);
  // medial indent
  ctx.bezierCurveTo(cx - 18, cy + 0, cx - 8, cy + 4, cx, cy + 6);
  ctx.bezierCurveTo(cx + 8, cy + 4, cx + 18, cy + 0, cx + 22, cy + 4);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = 'rgba(60, 25, 18, 0.65)';
  ctx.lineWidth = 1.3;
  ctx.stroke();
  // Adrenal gland cap (sitting on top of kidney)
  const adrenalFill = ctx.createRadialGradient(cx - 4, cy - 10, 0, cx, cy - 6, 18);
  adrenalFill.addColorStop(0, '#fed7aa');
  adrenalFill.addColorStop(0.55, '#fb923c');
  adrenalFill.addColorStop(1, '#7c2d12');
  ctx.fillStyle = adrenalFill;
  // triangular cap, lying horizontally on top of the kidney
  ctx.beginPath();
  ctx.moveTo(cx - 20, cy - 6);
  ctx.bezierCurveTo(cx - 14, cy - 18, cx, cy - 20, cx + 8, cy - 16);
  ctx.bezierCurveTo(cx + 18, cy - 12, cx + 22, cy - 6, cx + 22, cy - 2);
  ctx.bezierCurveTo(cx + 12, cy + 4, cx - 6, cy + 4, cx - 20, cy - 2);
  ctx.bezierCurveTo(cx - 22, cy - 4, cx - 22, cy - 6, cx - 20, cy - 6);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = 'rgba(110, 40, 12, 0.7)';
  ctx.lineWidth = 1.3;
  ctx.stroke();
  // Inner cortex/medulla suggestion
  ctx.strokeStyle = 'rgba(110, 40, 12, 0.4)';
  ctx.lineWidth = 0.9;
  ctx.beginPath();
  ctx.moveTo(cx - 14, cy - 9);
  ctx.bezierCurveTo(cx - 4, cy - 12, cx + 6, cy - 12, cx + 16, cy - 8);
  ctx.stroke();
  // Hormone particles when active (adrenaline release)
  if (active > 0.1) {
    for (let i = 0; i < 7; i++) {
      const ph = ((t || 0) / 600 + i * 0.14) % 1;
      const a2 = (1 - ph) * 0.65 * active;
      const ang = -Math.PI * 0.6 + i * 0.25;
      const px = cx + Math.cos(ang) * (22 + ph * 22);
      const py = cy - 6 + Math.sin(ang) * (16 + ph * 14);
      ctx.fillStyle = rgba(n.color, a2);
      ctx.beginPath();
      ctx.arc(px, py, 2.4, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  // Label
  ctx.fillStyle = rgba(n.color, 0.95);
  ctx.font = '600 12px -apple-system, system-ui';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('Adrenal Gland', cx, cy + 50);
  ctx.fillStyle = 'rgba(160, 160, 160, 0.7)';
  ctx.font = '500 10px -apple-system, system-ui';
  ctx.fillText('(on the kidney)', cx, cy + 64);
  ctx.restore();
}

function drawMotorNeuron(ctx, opts = {}) {
  const n = OUTPUTS.motorNeuron;
  const t = opts.t || 0;
  const active = opts.active || 0;
  const cx = n.x, cy = n.y;
  ctx.save();
  if (active > 0.05) {
    const halo = ctx.createRadialGradient(cx, cy, 0, cx, cy, 50);
    halo.addColorStop(0, rgba(n.color, 0.4 * active));
    halo.addColorStop(1, rgba(n.color, 0));
    ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(cx, cy, 50, 0, Math.PI * 2); ctx.fill();
  }
  // Dendrites at top-left
  ctx.strokeStyle = '#c78373';
  ctx.lineWidth = 2.8;
  ctx.lineCap = 'round';
  for (let i = 0; i < 5; i++) {
    const a = -Math.PI * 0.7 + i * 0.16;
    const ex = cx + Math.cos(a) * 24;
    const ey = cy + Math.sin(a) * 24;
    ctx.beginPath();
    ctx.moveTo(cx - 3, cy - 3);
    ctx.lineTo(ex, ey);
    ctx.stroke();
  }
  // Soma (cell body)
  const somaFill = ctx.createRadialGradient(cx - 5, cy - 5, 0, cx, cy, 16);
  somaFill.addColorStop(0, '#f8d9ce');
  somaFill.addColorStop(0.65, '#d49a8d');
  somaFill.addColorStop(1, '#8c4d3e');
  ctx.fillStyle = somaFill;
  ctx.beginPath();
  ctx.arc(cx, cy, 15, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = 'rgba(115, 60, 48, 0.65)';
  ctx.lineWidth = 1.3;
  ctx.stroke();
  // Nucleus
  ctx.fillStyle = 'rgba(80, 40, 30, 0.85)';
  ctx.beginPath();
  ctx.arc(cx - 1, cy - 1, 5.5, 0, Math.PI * 2);
  ctx.fill();
  // Axon stretching to muscle
  ctx.strokeStyle = '#c78373';
  ctx.lineWidth = 5;
  ctx.lineCap = 'round';
  const tmx = OUTPUTS.muscle.x - 32;
  const tmy = OUTPUTS.muscle.y + 12;
  const ctrlX = cx + 60, ctrlY = cy - 60;
  ctx.beginPath();
  ctx.moveTo(cx + 12, cy - 2);
  ctx.quadraticCurveTo(ctrlX, ctrlY, tmx, tmy);
  ctx.stroke();
  // Inner highlight on axon
  ctx.strokeStyle = 'rgba(255, 220, 205, 0.30)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(cx + 12, cy - 4);
  ctx.quadraticCurveTo(ctrlX, ctrlY - 3, tmx, tmy - 3);
  ctx.stroke();
  // Axon terminals branching to muscle
  ctx.strokeStyle = '#c78373';
  for (let i = 0; i < 4; i++) {
    const a = -0.45 + i * 0.25;
    const ex = tmx + Math.cos(a) * 16;
    const ey = tmy + Math.sin(a) * 16;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(tmx, tmy);
    ctx.lineTo(ex, ey);
    ctx.stroke();
    ctx.fillStyle = '#d49a8d';
    ctx.beginPath();
    ctx.arc(ex, ey, 3.5, 0, Math.PI * 2);
    ctx.fill();
  }
  // Active pulse along axon
  if (active > 0.1) {
    const ph = ((t || 0) / 350) % 1;
    const u = 1 - ph;
    const sx = cx + 12, sy = cy - 2;
    const px = u * u * sx + 2 * u * ph * ctrlX + ph * ph * tmx;
    const py = u * u * sy + 2 * u * ph * ctrlY + ph * ph * tmy;
    const g = ctx.createRadialGradient(px, py, 0, px, py, 14);
    g.addColorStop(0, 'rgba(255,255,255,0.92)');
    g.addColorStop(0.4, rgba(n.color, 0.85));
    g.addColorStop(1, rgba(n.color, 0));
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(px, py, 14, 0, Math.PI * 2); ctx.fill();
  }
  ctx.fillStyle = rgba(n.color, 0.95);
  ctx.font = '600 12px -apple-system, system-ui';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('Motor Neuron', cx, cy + 32);
  ctx.restore();
}

// Input / Output dispatchers.
function drawInput(ctx, key, opts = {}) {
  if (key === 'eye') drawEye(ctx, opts);
  else if (key === 'ear') drawEar(ctx, opts);
  else if (key === 'nose') drawNose(ctx, opts);
  else if (key === 'skin') drawHand(ctx, opts);
}

function drawOutput(ctx, key, opts = {}) {
  if (key === 'spinal') drawSpinalCord(ctx, opts.active || 0, opts.t || 0);
  else if (key === 'motorNeuron') drawMotorNeuron(ctx, opts);
  else if (key === 'muscle') drawMuscle(ctx, opts);
  else if (key === 'gland') drawGland(ctx, opts);
}

// ============================================================================
// PATHWAY HELPERS
// ============================================================================

// Get position for any node key (input, region, output).
function getNode(key) {
  if (REGIONS[key]) return REGIONS[key];
  if (INPUTS[key]) return INPUTS[key];
  if (OUTPUTS[key]) return OUTPUTS[key];
  return null;
}

// Draw a pathway segment between two nodes with optional glow.
function drawPathwaySegment(ctx, fromKey, toKey, opts = {}) {
  const a = getNode(fromKey);
  const b = getNode(toKey);
  if (!a || !b) return;
  const active = opts.active != null ? opts.active : 0; // 0..1 how active this segment is
  const dim = opts.dim || 0;
  const color = opts.color || '#c7d2fe';
  const curveAmt = opts.curve != null ? opts.curve : 0.18;
  const baseAlpha = active > 0.05 ? 0.75 + active * 0.20 : (0.18 - dim * 0.08);
  const width = 2.5 + active * 4.5;

  // Compute control point for a gentle curve
  const dx = b.x - a.x;
  const dy = b.y - a.y;
  const mx = (a.x + b.x) / 2 + dy * curveAmt;
  const my = (a.y + b.y) / 2 - dx * curveAmt;

  ctx.save();
  // Soft glow stroke
  if (active > 0.05) {
    ctx.strokeStyle = rgba(color, 0.25 * active);
    ctx.lineWidth = width + 12;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.quadraticCurveTo(mx, my, b.x, b.y);
    ctx.stroke();
  }
  // Dark outline for contrast against the brain
  if (active > 0.05) {
    ctx.strokeStyle = 'rgba(20, 14, 10, 0.55)';
    ctx.lineWidth = width + 2;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.quadraticCurveTo(mx, my, b.x, b.y);
    ctx.stroke();
  }
  // Main stroke
  ctx.strokeStyle = rgba(color, baseAlpha);
  ctx.lineWidth = width;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(a.x, a.y);
  ctx.quadraticCurveTo(mx, my, b.x, b.y);
  ctx.stroke();
  ctx.restore();

  return { a, b, mx, my };
}

// Compute point along quadratic curve
function quadPoint(a, mx, my, b, t) {
  const x = (1-t)*(1-t)*a.x + 2*(1-t)*t*mx + t*t*b.x;
  const y = (1-t)*(1-t)*a.y + 2*(1-t)*t*my + t*t*b.y;
  return { x, y };
}

// Animate a glowing pulse along a pathway segment.
function drawSignalPulse(ctx, fromKey, toKey, progress, opts = {}) {
  const a = getNode(fromKey);
  const b = getNode(toKey);
  if (!a || !b) return null;
  const color = opts.color || '#ffd166';
  const curveAmt = opts.curve != null ? opts.curve : 0.18;
  const dx = b.x - a.x, dy = b.y - a.y;
  const mx = (a.x + b.x) / 2 + dy * curveAmt;
  const my = (a.y + b.y) / 2 - dx * curveAmt;
  const t = clamp(progress, 0, 1);

  // Trail (longer, brighter for visibility through the brain)
  ctx.save();
  for (let i = 12; i >= 1; i--) {
    const tt = t - i * 0.022;
    if (tt < 0) continue;
    const p = quadPoint(a, mx, my, b, tt);
    const alpha = ((12 - i) / 12) ** 1.5 * 0.45;
    const rad = 6 + ((12 - i) / 12) * 8;
    const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, rad * 2.6);
    g.addColorStop(0, rgba(color, alpha));
    g.addColorStop(1, rgba(color, 0));
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(p.x, p.y, rad * 2.6, 0, Math.PI * 2);
    ctx.fill();
  }
  // Head — bigger, more luminous so it stays visible against the cortex
  const p = quadPoint(a, mx, my, b, t);
  const outerG = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, 38);
  outerG.addColorStop(0, rgba(color, 0.55));
  outerG.addColorStop(0.5, rgba(color, 0.25));
  outerG.addColorStop(1, rgba(color, 0));
  ctx.fillStyle = outerG;
  ctx.beginPath();
  ctx.arc(p.x, p.y, 38, 0, Math.PI * 2);
  ctx.fill();
  const headG = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, 18);
  headG.addColorStop(0, 'rgba(255,255,255,1)');
  headG.addColorStop(0.35, rgba(color, 1));
  headG.addColorStop(1, rgba(color, 0));
  ctx.fillStyle = headG;
  ctx.beginPath();
  ctx.arc(p.x, p.y, 18, 0, Math.PI * 2);
  ctx.fill();
  // Dark outline for contrast over the pink cortex
  ctx.strokeStyle = 'rgba(30, 18, 12, 0.55)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(p.x, p.y, 6.5, 0, Math.PI * 2);
  ctx.stroke();
  // Bright white core
  ctx.fillStyle = rgba('#ffffff', 0.98);
  ctx.beginPath();
  ctx.arc(p.x, p.y, 5.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
  return p;
}

// Glassmorphic floating label with leader line.
function drawLabel(ctx, text, lx, ly, tx, ty, color = '#ffd166', fontSize = 13) {
  const [r, g, b] = hexToRgb(color);
  ctx.save();
  const leaderGrad = ctx.createLinearGradient(lx, ly, tx, ty);
  leaderGrad.addColorStop(0, `rgba(${r},${g},${b},0.85)`);
  leaderGrad.addColorStop(1, `rgba(${r},${g},${b},0.25)`);
  ctx.strokeStyle = leaderGrad;
  ctx.lineWidth = 1.2;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(lx, ly);
  ctx.lineTo(tx, ty);
  ctx.stroke();

  const pulse = (Math.sin((animT || 0) / 400) + 1) * 0.5;
  ctx.strokeStyle = `rgba(${r},${g},${b},${0.25 + pulse * 0.25})`;
  ctx.lineWidth = 1.3;
  ctx.beginPath();
  ctx.arc(tx, ty, 6 + pulse * 2.5, 0, Math.PI * 2);
  ctx.stroke();

  const dotGlow = ctx.createRadialGradient(tx, ty, 0, tx, ty, 12);
  dotGlow.addColorStop(0, `rgba(${r},${g},${b},0.55)`);
  dotGlow.addColorStop(1, `rgba(${r},${g},${b},0)`);
  ctx.fillStyle = dotGlow;
  ctx.beginPath(); ctx.arc(tx, ty, 12, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(tx, ty, 3, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.beginPath(); ctx.arc(tx - 0.7, ty - 0.7, 1.2, 0, Math.PI * 2); ctx.fill();

  ctx.font = `600 ${fontSize}px -apple-system, system-ui`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const m = ctx.measureText(text);
  const padX = 12, padY = 7;
  const bw = m.width + padX * 2;
  const bh = fontSize + padY * 2;
  const bx = lx - bw / 2, by = ly - bh / 2;

  ctx.shadowBlur = 16;
  ctx.shadowColor = `rgba(${r},${g},${b},0.32)`;
  ctx.shadowOffsetY = 3;
  const bgGrad = ctx.createLinearGradient(0, by, 0, by + bh);
  bgGrad.addColorStop(0, 'rgba(28, 32, 48, 0.92)');
  bgGrad.addColorStop(1, 'rgba(14, 18, 30, 0.92)');
  ctx.fillStyle = bgGrad;
  if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, bh / 2); ctx.fill(); }
  else { ctx.fillRect(bx, by, bw, bh); }
  ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
  ctx.strokeStyle = `rgba(${r},${g},${b},0.55)`;
  ctx.lineWidth = 1;
  if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, bh / 2); ctx.stroke(); }
  ctx.fillStyle = color;
  ctx.fillText(text, lx, ly + 0.5);
  ctx.restore();
}

// Base brain anatomy — drawn once per frame as the foundation. Cerebellum,
// brain stem, and spinal cord are drawn via drawAllNodes (their activation

  parietal:     { lx: 790, ly: 40 },

  hypothalamus: { lx: 345, ly: 358 },
  amygdala:     { lx: 1115, ly: 360 },
  hippocampus:  { lx: 1115, ly: 400 },
  // Hindbrain
  cerebellum:   { lx: 1115, ly: 460 },

function drawPersistentLabel(ctx, text, lx, ly, tx, ty, color, isActive) {
  ctx.save();
  // Leader line — subtle when inactive, brighter when active
  ctx.strokeStyle = rgba(color, isActive ? 0.7 : 0.30);
  ctx.lineWidth = 1;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(lx, ly);
  ctx.lineTo(tx, ty);
  ctx.stroke();
  // Anchor dot on the structure
  ctx.fillStyle = rgba(color, isActive ? 0.95 : 0.50);
  ctx.beginPath();
  ctx.arc(tx, ty, 2.4, 0, Math.PI * 2);
  ctx.fill();
  // Label background pill
  ctx.font = isActive ? '700 11px -apple-system, system-ui' : '600 10px -apple-system, system-ui';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const m = ctx.measureText(text);
  const padX = 7, padY = 5;
  const w = m.width + padX * 2;
  const h = (isActive ? 11 : 10) + padY * 2;
  const bx = lx - w / 2, by = ly - h / 2;
  ctx.fillStyle = isActive ? 'rgba(20, 24, 38, 0.94)' : 'rgba(14, 18, 30, 0.78)';
  if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(bx, by, w, h, h / 2); ctx.fill(); }
  ctx.strokeStyle = rgba(color, isActive ? 0.65 : 0.32);
  ctx.lineWidth = 1;
  if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(bx, by, w, h, h / 2); ctx.stroke(); }
  ctx.fillStyle = rgba(color, isActive ? 1 : 0.78);
  ctx.fillText(text, lx, ly + 0.5);
  ctx.restore();
}

function drawAllLabels(ctx, activationMap) {
  activationMap = activationMap || {};
  Object.keys(LABEL_LAYOUTS).forEach(key => {
    const r = REGIONS[key];
    const layout = LABEL_LAYOUTS[key];
    if (!r || !layout) return;
    const activation = activationMap[key] || 0;
    // Only show labels for regions actively part of the current pathway.
    // Reduces cognitive load — keeps the brain quiet for non-involved regions.
    if (activation < 0.15) return;
    drawPersistentLabel(ctx, r.label, layout.lx, layout.ly, r.x, r.y, r.color, true);
  });
}

// Shared scene state + mouse plumbing.

let currentSceneIdx = 0;
let animT = 0;
let sceneFadeT = 0;
let sceneLocal = {};

function clearField() { sceneLocal = {}; }

// Translate a DOM mouse event into canvas-space coords.
function canvasXY(e) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (e.clientX - rect.left) * (canvas.width / rect.width),
    y: (e.clientY - rect.top) * (canvas.height / rect.height),
  };
}

canvas.addEventListener('mousemove', (e) => {
  const s = scenes[currentSceneIdx];
  if (!s || !s.onMouseMove) return;
  const { x, y } = canvasXY(e);
  s.onMouseMove(x, y);
});
canvas.addEventListener('mouseleave', () => {
  const s = scenes[currentSceneIdx];
  if (s && s.onMouseMove) s.onMouseMove(-1, -1);
});
canvas.addEventListener('mousedown', (e) => {
  const s = scenes[currentSceneIdx];
  if (!s || !s.onMouseDown) return;
  const { x, y } = canvasXY(e);
  s.onMouseDown(x, y);
});
canvas.addEventListener('mouseup', () => {
  const s = scenes[currentSceneIdx];
  if (s && s.onMouseUp) s.onMouseUp();
});
canvas.addEventListener('click', (e) => {
  const s = scenes[currentSceneIdx];
  if (!s || !s.onClick) return;
  const { x, y } = canvasXY(e);
  s.onClick(x, y);
});
