// SCENE 1: Intro — From Neuron to Brain Systems
// ----------------------------------------------------------------------------
const sceneIntro = {
  phase: 'Step 1: From Neuron to Brain Systems',
  phaseColor: '#ffd166',
  notes: "In the last two simulations you watched an <strong>action potential</strong> race down a single neuron and cross a single <strong>synapse</strong>. Now we zoom out. Those same signals are firing across <strong>billions of neurons</strong> at the same time, wiring entire brain regions together. The brain is an <strong>input-output machine</strong>: stimulus from the world arrives, travels through neural pathways, and produces a response back into the world.",
  notebook: "Write the title <strong>Brain Pathways: From Stimulus to Response</strong>. Underneath, draw the chain: <strong>action potential → synapse → brain systems</strong>. Move through all three sub-phases (Neuron, Synapse, Brain) using the <strong>Next Phase →</strong> button before continuing.",
  setup() {
    clearField();
    sceneLocal = { phaseIdx: 0, maxPhaseReached: 0, t: 0, bolt: 0, sparkles: [], fadeIn: 0 };
  },
  setPhase(i) {
    sceneLocal.phaseIdx = clamp(i, 0, 2);
    if (sceneLocal.phaseIdx > (sceneLocal.maxPhaseReached || 0)) {
      sceneLocal.maxPhaseReached = sceneLocal.phaseIdx;
    }
    sceneLocal.t = 0;
    sceneLocal.bolt = 0;
    sceneLocal.fadeIn = 0;
    sceneLocal.flyingPulses = [];
    if (typeof updateIntroControls === 'function') updateIntroControls();
    if (typeof refreshNextButton === 'function') refreshNextButton();
  },
  canAdvance() {
    return (sceneLocal.maxPhaseReached || 0) >= 2;
  },
  update(dt) {
    sceneLocal.t += dt;
    sceneLocal.fadeIn = Math.min(1, sceneLocal.fadeIn + dt / 500);
    if (sceneLocal.phaseIdx === 0) {
      sceneLocal.bolt = (sceneLocal.t / 2400) % 1;
    } else {
      sceneLocal.bolt = 1;
    }
    // Sparkles
    sceneLocal.sparkles = sceneLocal.sparkles.filter(s => s.life > 0);
    sceneLocal.sparkles.forEach(s => { s.life -= dt / 600; s.x += s.vx; s.y += s.vy; });
    if (Math.random() < 0.10) {
      sceneLocal.sparkles.push({ x: W/2 + (Math.random()-0.5)*W*0.6, y: H/2 + (Math.random()-0.5)*H*0.5, vx: (Math.random()-0.5)*0.4, vy: (Math.random()-0.5)*0.4, life: 1 });
    }
  },
  draw(ctx, t) {
    const ph = sceneLocal.phaseIdx;
    const fade = sceneLocal.fadeIn;

    // Background ambient sparkles
    sceneLocal.sparkles.forEach(s => {
      const a = s.life * 0.30;
      const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, 18);
      g.addColorStop(0, `rgba(199, 210, 254, ${a})`);
      g.addColorStop(1, `rgba(99, 102, 241, 0)`);
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(s.x, s.y, 18, 0, Math.PI * 2); ctx.fill();
    });

    if (ph === 0) {
      // Phase 1: Review — Action Potential app neuron
      ctx.save();
      ctx.globalAlpha = fade;
      drawReviewNeuron(ctx, sceneLocal.bolt, t);
      ctx.restore();
      drawIntroHeading(ctx,
        'A signal races down one neuron',
        'Review from the Action Potential app',
        fade, '#ffd166');
    } else if (ph === 1) {
      // Phase 2: Review — Synapse app cleft
      ctx.save();
      ctx.globalAlpha = fade;
      drawReviewSynapse(ctx, Math.min(1, sceneLocal.t / 1500), t);
      ctx.restore();
      drawIntroHeading(ctx,
        'It crosses a synapse to the next neuron',
        'Review from the Synapse app',
        fade, '#f472b6');
    } else {
      // Phase 3: full brain reveal with signals flying from every sense
      ctx.save();
      ctx.globalAlpha = fade;
      drawBrainBase(ctx, { silhouetteAlpha: fade });
      const activeKeys = ['frontal','motor','parietal','occipital','temporal','thalamus','amygdala','accumbens','cerebellum','brainstem','hippocampus','hypothalamus','basalganglia'];
      activeKeys.forEach((k, i) => {
        const phaseOffset = (Math.sin(t / 500 + i * 0.7) + 1) * 0.5;
        drawRegion(ctx, k, { t, active: 0.25 + phaseOffset * 0.30 });
      });
      Object.keys(INPUTS).forEach((k, i) => {
        const phaseOffset = (Math.sin(t / 600 + i) + 1) * 0.5;
        drawInput(ctx, k, { t, active: 0.45 + phaseOffset * 0.30 });
      });
      Object.keys(OUTPUTS).forEach((k, i) => {
        const phaseOffset = (Math.sin(t / 700 + i + 2) + 1) * 0.5;
        drawOutput(ctx, k, { t, active: 0.2 + phaseOffset * 0.30 });
      });
      // Animated flying signals — each sense fires pulses to multiple brain regions
      if (!sceneLocal.flyingPulses) sceneLocal.flyingPulses = [];
      // spawn new pulses
      if (Math.random() < 0.18) {
        const sensors = Object.keys(INPUTS);
        const targets = ['thalamus','amygdala','hippocampus','frontal','parietal','occipital','temporal','accumbens','cerebellum','motor','basalganglia','hypothalamus'];
        const sensor = sensors[Math.floor(Math.random() * sensors.length)];
        const target = targets[Math.floor(Math.random() * targets.length)];
        sceneLocal.flyingPulses.push({
          from: sensor,
          to: target,
          progress: 0,
          speed: 0.0007 + Math.random() * 0.0008,
          color: INPUTS[sensor].color
        });
      }
      // advance + draw + cull
      sceneLocal.flyingPulses.forEach(p => { p.progress += p.speed * 16; });
      sceneLocal.flyingPulses = sceneLocal.flyingPulses.filter(p => p.progress < 1.05);
      sceneLocal.flyingPulses.forEach(p => {
        drawPathwaySegment(ctx, p.from, p.to, { color: p.color, active: 0.55 });
        drawSignalPulse(ctx, p.from, p.to, Math.min(1, p.progress), { color: p.color });
      });
      ctx.restore();
      drawIntroHeading(ctx,
        'Billions of those signals build entire brain systems',
        'stimulus enters, the brain processes, response leaves',
        fade, '#c7d2fe');
    }
  },
  isInteractive: true,
  controlsHTML: `<button class="chip" id="introPrev">← Prev Phase</button><div class="sim-readout">Phase <strong id="introPhase">1 / 3</strong> <span id="introPhaseLabel" style="margin-left:6px;color:#a0a0a0">Neuron</span></div><button class="chip warm" id="introNext">Next Phase →</button>`,
  bindControls() {
    document.getElementById('introPrev').onclick = () => sceneIntro.setPhase(sceneLocal.phaseIdx - 1);
    document.getElementById('introNext').onclick = () => sceneIntro.setPhase(sceneLocal.phaseIdx + 1);
    updateIntroControls();
  }
};

function updateIntroControls() {
  const el = document.getElementById('introPhase');
  const lab = document.getElementById('introPhaseLabel');
  const prev = document.getElementById('introPrev');
  const next = document.getElementById('introNext');
  if (!el) return;
  const labels = ['Neuron', 'Synapse', 'Brain'];
  el.textContent = `${sceneLocal.phaseIdx + 1} / 3`;
  if (lab) lab.textContent = labels[sceneLocal.phaseIdx];
  if (prev) prev.disabled = sceneLocal.phaseIdx === 0;
  if (next) next.disabled = sceneLocal.phaseIdx === 2;
}

// ----------------------------------------------------------------------------
// INTRO HELPERS — Seeded RNG + dendrite tree (ported from the Action Potential
// and Synapse apps so Phase 1 / Phase 2 of the intro match those visuals).
// ----------------------------------------------------------------------------
function seededRng(seed) {
  let s = seed;
  return function() { s = (s * 16807) % 2147483647; return s / 2147483647; };
}
function buildDendriteTree(x0, y0, angle, length, depth, rng, segments = []) {
  if (depth === 0 || length < 18) return segments;
  const endX = x0 + Math.cos(angle) * length;
  const endY = y0 + Math.sin(angle) * length;
  const cpX = x0 + Math.cos(angle) * length * 0.5 + (rng() - 0.5) * 30;
  const cpY = y0 + Math.sin(angle) * length * 0.5 + (rng() - 0.5) * 30;
  segments.push({ x1: x0, y1: y0, cx: cpX, cy: cpY, x2: endX, y2: endY, w: depth * 2 });
  const branchAngle = 0.45 + rng() * 0.3;
  const lenScale = 0.6 + rng() * 0.15;
  buildDendriteTree(endX, endY, angle - branchAngle, length * lenScale, depth - 1, rng, segments);
  buildDendriteTree(endX, endY, angle + branchAngle, length * lenScale, depth - 1, rng, segments);
  if (rng() > 0.6) {
    buildDendriteTree(endX, endY, angle + (rng() - 0.5) * 0.3, length * 0.5, depth - 1, rng, segments);
  }
  return segments;
}

// Phase 1 of intro: review — the Action Potential app neuron.
// Detailed dendrite tree, soma + nucleus, long axon, terminal bouquet.
function drawReviewNeuron(ctx, progress, t) {
  const MID = 340;
  const rng = seededRng(7);
  const soma = { x: 340, y: MID };
  const trees = [
    buildDendriteTree(soma.x - 70, soma.y - 85, -Math.PI * 0.72, 130, 4, rng),
    buildDendriteTree(soma.x - 95, soma.y - 35, -Math.PI * 0.92, 120, 4, rng),
    buildDendriteTree(soma.x - 98, soma.y + 25, Math.PI * 0.94, 120, 4, rng),
    buildDendriteTree(soma.x - 70, soma.y + 85, Math.PI * 0.72, 130, 4, rng),
    buildDendriteTree(soma.x - 30, soma.y - 100, -Math.PI * 0.55, 110, 3, rng),
    buildDendriteTree(soma.x - 30, soma.y + 100, Math.PI * 0.55, 110, 3, rng)
  ];
  ctx.save();
  ctx.lineCap = 'round';
  trees.forEach(tree => {
    tree.forEach(seg => {
      ctx.strokeStyle = `rgba(209, 154, 143, ${0.55 + seg.w * 0.05})`;
      ctx.lineWidth = seg.w;
      ctx.beginPath();
      ctx.moveTo(seg.x1, seg.y1);
      ctx.quadraticCurveTo(seg.cx, seg.cy, seg.x2, seg.y2);
      ctx.stroke();
    });
  });
  // Soma glow
  const glow = ctx.createRadialGradient(soma.x, soma.y, 0, soma.x, soma.y, 180);
  glow.addColorStop(0, 'rgba(245, 208, 197, 0.16)');
  glow.addColorStop(1, 'rgba(245, 208, 197, 0)');
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(soma.x, soma.y, 180, 0, Math.PI * 2); ctx.fill();
  // Soma body
  const somaFill = ctx.createRadialGradient(soma.x - 25, soma.y - 25, 10, soma.x, soma.y, 120);
  somaFill.addColorStop(0, '#f8d9ce');
  somaFill.addColorStop(0.7, '#d49a8d');
  somaFill.addColorStop(1, '#a86456');
  ctx.fillStyle = somaFill;
  ctx.beginPath();
  ctx.moveTo(soma.x - 95, soma.y + 5);
  ctx.bezierCurveTo(soma.x - 100, soma.y - 70, soma.x - 30, soma.y - 105, soma.x + 25, soma.y - 95);
  ctx.bezierCurveTo(soma.x + 85, soma.y - 85, soma.x + 110, soma.y - 30, soma.x + 105, soma.y + 5);
  ctx.bezierCurveTo(soma.x + 110, soma.y + 50, soma.x + 60, soma.y + 95, soma.x + 5, soma.y + 100);
  ctx.bezierCurveTo(soma.x - 55, soma.y + 105, soma.x - 95, soma.y + 65, soma.x - 95, soma.y + 5);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = 'rgba(140, 75, 60, 0.7)';
  ctx.lineWidth = 2; ctx.stroke();
  // Nucleus
  ctx.fillStyle = '#8f4c3e';
  ctx.beginPath(); ctx.arc(soma.x - 8, soma.y - 8, 36, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#5a2a1e';
  ctx.beginPath(); ctx.arc(soma.x + 2, soma.y - 2, 11, 0, Math.PI * 2); ctx.fill();
  // Axon hillock (cone leaving soma)
  ctx.fillStyle = '#d49a8d';
  ctx.beginPath();
  ctx.moveTo(soma.x + 95, soma.y - 28);
  ctx.lineTo(soma.x + 95, soma.y + 28);
  ctx.lineTo(soma.x + 170, soma.y + 14);
  ctx.lineTo(soma.x + 170, soma.y - 14);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(140, 75, 60, 0.6)';
  ctx.lineWidth = 1.5; ctx.stroke();
  // Axon trunk (long curved tube)
  ctx.strokeStyle = '#d49a8d';
  ctx.lineWidth = 28;
  ctx.lineCap = 'round';
  const termX = 1380;
  ctx.beginPath();
  ctx.moveTo(soma.x + 170, soma.y);
  ctx.bezierCurveTo(soma.x + 430, soma.y - 14, soma.x + 760, soma.y + 14, termX, soma.y);
  ctx.stroke();
  // Axon top highlight
  ctx.strokeStyle = 'rgba(255, 220, 208, 0.35)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(soma.x + 170, soma.y - 9);
  ctx.bezierCurveTo(soma.x + 430, soma.y - 23, soma.x + 760, soma.y + 5, termX, soma.y - 9);
  ctx.stroke();
  // Terminal bouquet — multiple branching axon terminals with bulbs
  const termAngles = [-0.55, -0.28, -0.05, 0.22, 0.5, -0.42, 0.38];
  termAngles.forEach((a, i) => {
    const len = 120 + (i % 3) * 20;
    ctx.strokeStyle = '#d49a8d';
    ctx.lineWidth = 10 + (i % 2) * 3;
    ctx.beginPath();
    ctx.moveTo(termX, soma.y);
    const mx = termX + Math.cos(a) * len * 0.55;
    const my = soma.y + Math.sin(a) * len * 0.55 + (i % 2 === 0 ? 8 : -8);
    const ex = termX + Math.cos(a) * len;
    const ey = soma.y + Math.sin(a) * len;
    ctx.quadraticCurveTo(mx, my, ex, ey);
    ctx.stroke();
    const bg = ctx.createRadialGradient(ex - 3, ey - 3, 2, ex, ey, 18);
    bg.addColorStop(0, '#fae2d4'); bg.addColorStop(1, '#c78373');
    ctx.fillStyle = bg;
    ctx.beginPath(); ctx.arc(ex, ey, 14 + (i % 3) * 2, 0, Math.PI * 2); ctx.fill();
  });
  // Lightning bolt along the axon
  if (progress > 0) {
    const startX = soma.x + 170;
    const endX = termX;
    ctx.save();
    ctx.strokeStyle = 'rgba(255, 209, 102, 0.5)';
    ctx.lineWidth = 14;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.shadowBlur = 28;
    ctx.shadowColor = 'rgba(255, 209, 102, 0.9)';
    const segs = 22;
    const points = [];
    for (let i = 0; i <= segs; i++) {
      const f = i / segs;
      const x = lerp(startX, endX, f);
      const baseOffsetY = Math.sin(f * Math.PI * 2.2) * 6;
      const jag = (Math.random() - 0.5) * 14;
      points.push({ x, y: soma.y + baseOffsetY + jag * (f < progress ? 1 : 0) });
    }
    ctx.beginPath();
    for (let i = 0; i <= segs; i++) {
      const f = i / segs; if (f > progress) break;
      const p = points[i]; if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
    }
    ctx.stroke();
    ctx.shadowBlur = 14;
    ctx.shadowColor = 'rgba(255, 255, 255, 0.9)';
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.95)';
    ctx.lineWidth = 4;
    ctx.beginPath();
    for (let i = 0; i <= segs; i++) {
      const f = i / segs; if (f > progress) break;
      const p = points[i]; if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
    }
    ctx.stroke();
    ctx.restore();
  }
  ctx.restore();
}

// Phase 2 of intro: review — the Synapse app cleft.
// Presynaptic bouton (mushroom) + cleft + postsynaptic dendrite,
// vesicles inside the bouton, NTs flowing across, receptors waiting.
function drawReviewSynapse(ctx, progress, t) {
  const MID = 340;
  const PRE_X = 720;     // presynaptic membrane facing cleft
  const POST_X = 880;    // postsynaptic membrane facing cleft
  const ACT_TOP = 225;
  const ACT_BOT = 455;
  ctx.save();

  // Axon trail entering pre from far left
  ctx.strokeStyle = '#c78373';
  ctx.lineWidth = 36;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(0, MID);
  ctx.lineTo(220, MID);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(255, 220, 208, 0.3)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, MID - 14);
  ctx.lineTo(220, MID - 14);
  ctx.stroke();

  // Pre-synaptic terminal (mushroom shape from synapse app)
  const preGlow = ctx.createRadialGradient(470, MID, 0, 470, MID, 380);
  preGlow.addColorStop(0, 'rgba(245, 208, 197, 0.10)');
  preGlow.addColorStop(1, 'rgba(245, 208, 197, 0)');
  ctx.fillStyle = preGlow;
  ctx.beginPath(); ctx.arc(470, MID, 380, 0, Math.PI * 2); ctx.fill();
  const preFill = ctx.createRadialGradient(420, MID - 60, 20, 470, MID, 300);
  preFill.addColorStop(0, '#f8d9ce');
  preFill.addColorStop(0.5, '#d49a8d');
  preFill.addColorStop(1, '#a86456');
  ctx.fillStyle = preFill;
  ctx.beginPath();
  ctx.moveTo(200, MID - 20);
  ctx.bezierCurveTo(260, MID - 32, 290, MID - 70, 320, MID - 130);
  ctx.bezierCurveTo(360, MID - 200, 510, MID - 230, 620, MID - 200);
  ctx.bezierCurveTo(690, MID - 175, 720, MID - 145, 720, MID - 115);
  ctx.lineTo(720, MID + 115);
  ctx.bezierCurveTo(720, MID + 145, 690, MID + 175, 620, MID + 200);
  ctx.bezierCurveTo(510, MID + 230, 360, MID + 200, 320, MID + 130);
  ctx.bezierCurveTo(290, MID + 70, 260, MID + 32, 200, MID + 20);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = 'rgba(140, 75, 60, 0.5)';
  ctx.lineWidth = 2; ctx.stroke();
  // Membrane highlight on active zone
  ctx.strokeStyle = 'rgba(212, 165, 84, 0.85)';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(720, MID - 115);
  ctx.lineTo(720, MID + 115);
  ctx.stroke();

  // Post-synaptic dendrite (mirrored mushroom)
  const W2 = 1600;
  const postGlow = ctx.createRadialGradient(1130, MID, 0, 1130, MID, 380);
  postGlow.addColorStop(0, 'rgba(176, 132, 255, 0.10)');
  postGlow.addColorStop(1, 'rgba(176, 132, 255, 0)');
  ctx.fillStyle = postGlow;
  ctx.beginPath(); ctx.arc(1130, MID, 380, 0, Math.PI * 2); ctx.fill();
  const postFill = ctx.createRadialGradient(1180, MID - 60, 20, 1130, MID, 300);
  postFill.addColorStop(0, '#d4c0ee');
  postFill.addColorStop(0.5, '#9a7fc0');
  postFill.addColorStop(1, '#705396');
  ctx.fillStyle = postFill;
  ctx.beginPath();
  ctx.moveTo(W2 - 200, MID - 20);
  ctx.bezierCurveTo(W2 - 260, MID - 32, W2 - 290, MID - 70, W2 - 320, MID - 130);
  ctx.bezierCurveTo(W2 - 360, MID - 200, W2 - 510, MID - 230, W2 - 620, MID - 200);
  ctx.bezierCurveTo(W2 - 690, MID - 175, W2 - 720, MID - 145, W2 - 720, MID - 115);
  ctx.lineTo(880, MID + 115);
  ctx.bezierCurveTo(W2 - 720, MID + 145, W2 - 690, MID + 175, W2 - 620, MID + 200);
  ctx.bezierCurveTo(W2 - 510, MID + 230, W2 - 360, MID + 200, W2 - 320, MID + 130);
  ctx.bezierCurveTo(W2 - 290, MID + 70, W2 - 260, MID + 32, W2 - 200, MID + 20);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = 'rgba(80, 60, 110, 0.5)';
  ctx.lineWidth = 2; ctx.stroke();
  // Post-membrane highlight
  ctx.strokeStyle = 'rgba(212, 165, 84, 0.85)';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(880, MID - 115);
  ctx.lineTo(880, MID + 115);
  ctx.stroke();

  // Dendrite trail to the right
  ctx.strokeStyle = '#9a7fc0';
  ctx.lineWidth = 36;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(W2 - 220, MID);
  ctx.lineTo(W2, MID);
  ctx.stroke();

  // Vesicles inside the bouton (full of NTs)
  const vesiclePositions = [
    { x: 460, y: MID - 110 }, { x: 540, y: MID - 90 }, { x: 600, y: MID - 60 },
    { x: 470, y: MID - 30 }, { x: 560, y: MID }, { x: 620, y: MID + 30 },
    { x: 470, y: MID + 70 }, { x: 540, y: MID + 100 }, { x: 600, y: MID + 130 }
  ];
  vesiclePositions.forEach(v => {
    const vg = ctx.createRadialGradient(v.x - 5, v.y - 5, 0, v.x, v.y, 18);
    vg.addColorStop(0, 'rgba(255, 245, 220, 0.95)');
    vg.addColorStop(0.7, 'rgba(255, 220, 170, 0.7)');
    vg.addColorStop(1, 'rgba(212, 165, 84, 0.5)');
    ctx.fillStyle = vg;
    ctx.beginPath(); ctx.arc(v.x, v.y, 18, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(255, 209, 102, 0.85)';
    ctx.lineWidth = 1.5; ctx.stroke();
    // NT dots inside vesicle
    ctx.fillStyle = '#f472b6';
    for (let i = 0; i < 5; i++) {
      const a = i * 1.25;
      ctx.beginPath();
      ctx.arc(v.x + Math.cos(a) * 9, v.y + Math.sin(a) * 9, 2.5, 0, Math.PI * 2);
      ctx.fill();
    }
  });

  // Receptors on the post-membrane (Y-cups)
  const recYs = [MID - 90, MID - 40, MID + 10, MID + 60, MID + 110];
  recYs.forEach(y => {
    const trunkGrad = ctx.createLinearGradient(POST_X, 0, POST_X + 22, 0);
    trunkGrad.addColorStop(0, 'rgba(90, 65, 140, 0.98)');
    trunkGrad.addColorStop(1, 'rgba(50, 35, 90, 0.98)');
    ctx.fillStyle = trunkGrad;
    roundRect(ctx, POST_X, y - 18, 22, 36, 6);
    ctx.fill();
    const armGrad = ctx.createLinearGradient(POST_X - 22, 0, POST_X + 2, 0);
    armGrad.addColorStop(0, '#9a7fc0');
    armGrad.addColorStop(1, '#604584');
    ctx.fillStyle = armGrad;
    ctx.beginPath();
    ctx.moveTo(POST_X + 2, y - 22);
    ctx.lineTo(POST_X - 22, y - 16);
    ctx.lineTo(POST_X - 22, y - 6);
    ctx.lineTo(POST_X + 2, y - 4);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(POST_X + 2, y + 22);
    ctx.lineTo(POST_X - 22, y + 16);
    ctx.lineTo(POST_X - 22, y + 6);
    ctx.lineTo(POST_X + 2, y + 4);
    ctx.closePath(); ctx.fill();
    // socket
    const sg = ctx.createRadialGradient(POST_X - 12, y - 2, 0, POST_X - 10, y, 10);
    sg.addColorStop(0, 'rgba(60, 40, 90, 0.98)');
    sg.addColorStop(1, 'rgba(20, 12, 40, 0.98)');
    ctx.fillStyle = sg;
    ctx.beginPath(); ctx.arc(POST_X - 10, y, 9, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(176, 132, 255, 0.65)';
    ctx.lineWidth = 1.5; ctx.stroke();
  });

  // NTs in the cleft — drift slightly, flow rightward with progress
  const flow = Math.min(1, progress);
  for (let i = 0; i < 14; i++) {
    const baseX = PRE_X + 10 + (i % 3) * 15 + Math.sin(t / 400 + i) * 3;
    const targetX = POST_X - 16 + (i % 3) * 6;
    const px = lerp(baseX, targetX, flow);
    const py = ACT_TOP + 20 + (i % 7) * 28 + Math.sin(t / 500 + i * 1.3) * 5;
    // glow
    const glow = ctx.createRadialGradient(px, py, 0, px, py, 18);
    glow.addColorStop(0, 'rgba(244, 114, 182, 0.55)');
    glow.addColorStop(1, 'rgba(244, 114, 182, 0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(px, py, 18, 0, Math.PI * 2); ctx.fill();
    // core
    const cg = ctx.createRadialGradient(px - 2, py - 2, 0, px, py, 8);
    cg.addColorStop(0, 'rgba(255,255,255,0.95)');
    cg.addColorStop(0.35, '#f472b6');
    cg.addColorStop(1, '#a02868');
    ctx.fillStyle = cg;
    ctx.beginPath(); ctx.arc(px, py, 7, 0, Math.PI * 2); ctx.fill();
  }

  ctx.restore();
}

function pickNode(x, y) {
  // sort by radius ascending so small deep structures get clicked
  // over the larger cortex blobs they sit inside
  const all = [...Object.keys(REGIONS), ...Object.keys(INPUTS), ...Object.keys(OUTPUTS)];
  all.sort((a, b) => getNode(a).r - getNode(b).r);
  for (const k of all) {
    const n = getNode(k);
    const dx = x - n.x, dy = y - n.y;
    if (Math.hypot(dx, dy) <= n.r + 6) return k;
  }
  return null;
}

function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
  const words = text.split(' ');
  let line = '';
  let yy = y;
  for (let i = 0; i < words.length; i++) {
    const test = line + words[i] + ' ';
    const m = ctx.measureText(test);
    if (m.width > maxWidth && i > 0) {
      ctx.fillText(line, x, yy);
      line = words[i] + ' ';
      yy += lineHeight;
    } else {
      line = test;
    }
  }
  ctx.fillText(line, x, yy);
}

// Draw all nodes (regions/inputs/outputs) with activation from a map.
// Also draws persistent labels on every brain region.
function drawAllNodes(ctx, t, activationMap, dimUnlit) {
  Object.keys(REGIONS).forEach(k => {
    const a = activationMap[k] || 0;
    drawRegion(ctx, k, { t, active: a, dim: dimUnlit && a < 0.05 ? 0.6 : 0 });
  });
  Object.keys(INPUTS).forEach(k => {
    const a = activationMap[k] || 0;
    drawInput(ctx, k, { t, active: a });
  });
  Object.keys(OUTPUTS).forEach(k => {
    const a = activationMap[k] || 0;
    drawOutput(ctx, k, { t, active: a });
  });
  // Persistent labels on every brain region — active ones get bolder
  drawAllLabels(ctx, activationMap);
}

// ----------------------------------------------------------------------------
// STEP-BY-STEP HELPERS — scenes that want students to drive the impulse one
// segment at a time use these.
// ----------------------------------------------------------------------------
function setupStepByStep(nodes) {
  sceneLocal.nodes = nodes;
  sceneLocal.stepIdx = 0;
  sceneLocal.animating = false;
  sceneLocal.animProgress = 0;
  if (typeof refreshStepControls === 'function') refreshStepControls();
}

function updateStepByStep(dt) {
  if (sceneLocal.animating) {
    sceneLocal.animProgress += dt / 800; // ~800ms per segment animation
    if (sceneLocal.animProgress >= 1) {
      sceneLocal.animProgress = 0;
      sceneLocal.animating = false;
      sceneLocal.stepIdx++;
      refreshStepControls();
    }
  }
}

function drawStepByStep(ctx, t, color) {
  const nodes = sceneLocal.nodes;
  if (!nodes) return;
  // Light up all completed segments
  for (let i = 0; i < sceneLocal.stepIdx; i++) {
    drawPathwaySegment(ctx, nodes[i], nodes[i + 1], { color, active: 0.85 });
  }
  // Currently-animating segment (if any)
  if (sceneLocal.animating && sceneLocal.stepIdx < nodes.length - 1) {
    drawPathwaySegment(ctx, nodes[sceneLocal.stepIdx], nodes[sceneLocal.stepIdx + 1],
      { color, active: 0.5 + sceneLocal.animProgress * 0.4 });
    drawSignalPulse(ctx, nodes[sceneLocal.stepIdx], nodes[sceneLocal.stepIdx + 1],
      sceneLocal.animProgress, { color });
  }
  // Build activation map for region/label drawing
  const map = {};
  for (let i = 0; i <= sceneLocal.stepIdx; i++) map[nodes[i]] = 1;
  if (sceneLocal.animating && sceneLocal.stepIdx + 1 < nodes.length) {
    map[nodes[sceneLocal.stepIdx + 1]] = sceneLocal.animProgress;
  }
  drawAllNodes(ctx, t, map, true);
}

function stepNext() {
  if (!sceneLocal.nodes) return;
  if (sceneLocal.animating) return;
  if (sceneLocal.stepIdx < sceneLocal.nodes.length - 1) {
    sceneLocal.animating = true;
    sceneLocal.animProgress = 0;
    refreshStepControls();
  }
}

function stepReset() {
  sceneLocal.stepIdx = 0;
  sceneLocal.animating = false;
  sceneLocal.animProgress = 0;
  refreshStepControls();
}

function refreshStepControls() {
  const nextBtn = document.getElementById('stepNextBtn');
  const counter = document.getElementById('stepCounter');
  if (nextBtn && sceneLocal.nodes) {
    const total = sceneLocal.nodes.length - 1;
    const isDone = sceneLocal.stepIdx >= total;
    if (counter) counter.textContent = `${sceneLocal.stepIdx} / ${total}`;
    nextBtn.disabled = isDone || sceneLocal.animating;
    nextBtn.textContent = isDone ? '✓ Complete' : 'Next Step →';
  }
  // Keep the main Next-slide button in sync with sub-step progress.
  if (typeof refreshNextButton === 'function') refreshNextButton();
}

// Shared canAdvance for every step-by-step scene — must reach the last
// internal segment before students can move to the next slide.
function stepCanAdvance() {
  if (!sceneLocal.nodes) return true;
  return sceneLocal.stepIdx >= sceneLocal.nodes.length - 1;
}

const STEP_CONTROLS_HTML = `<button class="chip" id="stepResetBtn">↺ Reset</button><div class="sim-readout">Segment <strong id="stepCounter">0 / 0</strong></div><button class="chip warm" id="stepNextBtn">Next Step →</button>`;

function bindStepControls() {
  document.getElementById('stepNextBtn').onclick = stepNext;
  document.getElementById('stepResetBtn').onclick = stepReset;
  refreshStepControls();
}

function drawAnimatedSequence(ctx, nodes, progress, color, t) {
  if (!nodes || nodes.length < 2) return;
  const segCount = nodes.length - 1;
  const segProgress = progress * segCount;
  const currentSeg = Math.floor(Math.min(segProgress, segCount - 0.0001));
  const inSegT = segProgress - currentSeg;
  // segments
  for (let i = 0; i < segCount; i++) {
    let a;
    if (i < currentSeg) a = 0.9;
    else if (i === currentSeg) a = 0.5 + inSegT * 0.4;
    else a = 0.18;
    drawPathwaySegment(ctx, nodes[i], nodes[i+1], { color, active: a });
  }
  if (currentSeg < segCount && progress < 1) {
    drawSignalPulse(ctx, nodes[currentSeg], nodes[currentSeg+1], inSegT, { color });
  }
}

function drawEyeDiagram(ctx, x, y, t) {
  ctx.save();
  // ambient glow
  const halo = ctx.createRadialGradient(x + 60, y + 30, 0, x + 60, y + 30, 110);
  halo.addColorStop(0, rgba(C.occipital, 0.15));
  halo.addColorStop(1, rgba(C.occipital, 0));
  ctx.fillStyle = halo;
  ctx.beginPath(); ctx.arc(x + 60, y + 30, 110, 0, Math.PI * 2); ctx.fill();
  // eyeball
  const eyeGrad = ctx.createRadialGradient(x + 55, y + 20, 5, x + 60, y + 30, 60);
  eyeGrad.addColorStop(0, '#ffffff');
  eyeGrad.addColorStop(0.7, '#e0e7ff');
  eyeGrad.addColorStop(1, '#a5b4fc');
  ctx.fillStyle = eyeGrad;
  ctx.beginPath();
  ctx.ellipse(x + 60, y + 30, 55, 40, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = 'rgba(165, 180, 252, 0.6)';
  ctx.lineWidth = 1.3;
  ctx.stroke();
  // iris
  const irisGrad = ctx.createRadialGradient(x + 25, y + 26, 0, x + 25, y + 30, 18);
  irisGrad.addColorStop(0, '#c4b5fd');
  irisGrad.addColorStop(1, '#4338ca');
  ctx.fillStyle = irisGrad;
  ctx.beginPath();
  ctx.arc(x + 25, y + 30, 18, 0, Math.PI * 2);
  ctx.fill();
  // pupil
  ctx.fillStyle = '#0a0a0a';
  ctx.beginPath();
  ctx.arc(x + 25, y + 30, 8, 0, Math.PI * 2);
  ctx.fill();
  // light ray entering
  const rayProgress = ((t / 1500) % 1);
  ctx.strokeStyle = rgba('#ffd166', 0.85);
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  ctx.shadowBlur = 16;
  ctx.shadowColor = 'rgba(255, 209, 102, 0.7)';
  ctx.beginPath();
  ctx.moveTo(x - 10, y + 30);
  ctx.lineTo(x + 25 + rayProgress * 35, y + 30);
  ctx.stroke();
  ctx.shadowBlur = 0;
  // retina (back of eye)
  ctx.strokeStyle = rgba(C.occipital, 0.85);
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(x + 60, y + 30, 42, -Math.PI * 0.35, Math.PI * 0.35);
  ctx.stroke();
  // optic nerve exit
  ctx.strokeStyle = rgba(C.occipital, 0.6);
  ctx.lineWidth = 6;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x + 105, y + 30);
  ctx.quadraticCurveTo(x + 140, y + 50, INPUTS.eye.x - 15, INPUTS.eye.y);
  ctx.stroke();
  // labels
  ctx.font = '600 11px -apple-system, system-ui';
  ctx.fillStyle = '#a0a0a0';
  ctx.textAlign = 'center';
  ctx.fillText('cornea + lens', x + 25, y - 6);
  ctx.fillText('retina', x + 90, y + 78);
  ctx.fillText('optic nerve', x + 130, y - 6);
  ctx.restore();
}

      reveal.textContent = sceneLocal.revealed ? 'Hide Key' : 'Reveal Key';
      updatePathwayKey();
    };
    updatePathwayKey();
  }
};

function updatePathwayKey() {
  const keyEl = document.getElementById('pathwayKey');
  const scn = SCENARIOS.find(s => s.id === sceneLocal.currentId);
  if (scn && sceneLocal.revealed) {
    keyEl.innerHTML = '<strong>Pathway:</strong> ' + scn.key;
    keyEl.classList.remove('hidden');
  } else {
    keyEl.classList.add('hidden');
  }
}

// SCENE 12: Challenge Mode — build a pathway
// ----------------------------------------------------------------------------
const CHALLENGES = [

    correct: ['skin','spinal','motorNeuron','muscle'],

    correct: ['ear','thalamus','amygdala','hypothalamus','gland'],

const ALL_BANK_KEYS = [
  ...Object.keys(INPUTS),
  ...Object.keys(REGIONS),
  ...Object.keys(OUTPUTS)

const sceneChallenge = {
  phase: 'Step 12: Challenge Mode',
  phaseColor: C.accent,
  notes: "Build a pathway from scratch. Pick a challenge, then <strong>click nodes in order</strong> from stimulus to response. The simulator will tell you if your pathway is plausible and give you a gentle hint if you miss a key region.",
  notebook: "Try each challenge. For any you miss, <strong>write the correct pathway in your notes</strong>. Then write one sentence about what you learned: which regions you forgot, which sensory inputs you confused, and what rule you will remember next time.",
  setup() {
    clearField();
    sceneLocal = {
      challengeId: 'c1',
      built: [],
      feedback: null,
      hovered: null,
      t: 0,
    };
  },
  update(dt) { sceneLocal.t += dt; },
  draw(ctx, t) {
    drawBrainBase(ctx, {});
    // Connect built nodes with a path line
    if (sceneLocal.built.length > 1) {
      for (let i = 0; i < sceneLocal.built.length - 1; i++) {
        drawPathwaySegment(ctx, sceneLocal.built[i], sceneLocal.built[i+1], { color: C.accent, active: 0.55 });
      }
      // animated pulse along built path
      const segCount = sceneLocal.built.length - 1;
      const phase = ((t / 1400) * segCount) % segCount;
      const seg = Math.floor(phase);
      const inT = phase - seg;
      drawSignalPulse(ctx, sceneLocal.built[seg], sceneLocal.built[seg+1], inT, { color: '#c7d2fe' });
    }
    // Render nodes with state
    const built = new Set(sceneLocal.built);
    Object.keys(REGIONS).forEach(k => {
      const isBuilt = built.has(k);
      const isHover = sceneLocal.hovered === k;
      drawRegion(ctx, k, { t, active: isBuilt ? 0.9 : 0, highlight: isHover ? 0.6 : 0 });
    });
    Object.keys(INPUTS).forEach(k => {
      drawInput(ctx, k, { t, active: built.has(k) ? 1 : 0 });
    });
    Object.keys(OUTPUTS).forEach(k => {
      drawOutput(ctx, k, { t, active: built.has(k) ? 1 : 0 });
    });
    // numbered order labels on built nodes
    sceneLocal.built.forEach((k, i) => {
      const n = getNode(k);
      if (!n) return;
      ctx.save();
      ctx.fillStyle = rgba(C.accent, 0.95);
      ctx.beginPath();
      ctx.arc(n.x + n.r * 0.65, n.y - n.r * 0.65, 10, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.font = '700 11px -apple-system, system-ui';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(String(i + 1), n.x + n.r * 0.65, n.y - n.r * 0.65);
      ctx.restore();
    });

    // Hover label
    if (sceneLocal.hovered) {
      const n = getNode(sceneLocal.hovered);
      if (n) {
        const color = n.color || '#c7d2fe';
        let lx, ly;
        if (REGIONS[sceneLocal.hovered]) {
          if (n.y < 200) { lx = n.x; ly = n.y - n.r - 24; }
          else if (n.y > 420) { lx = n.x; ly = n.y + n.r + 24; }
          else if (n.x < 600) { lx = n.x - n.r - 80; ly = n.y; }
          else { lx = n.x + n.r + 80; ly = n.y; }
        } else {
          lx = n.x; ly = n.y - n.r - 22;
        }
        drawLabel(ctx, n.label, lx, ly, n.x, n.y, color, 12);
      }
    }

    // Challenge prompt
    const ch = CHALLENGES.find(c => c.id === sceneLocal.challengeId);
    if (ch) {
      drawStimulusBadge(ctx, 90, 540, ch.emoji, ch.stim, C.accent);
      drawResponseBadge(ctx, 1490, 240, '🎯', ch.resp, C.accent);
      // Challenge banner top
      ctx.save();
      ctx.font = '700 14px -apple-system, system-ui';
      ctx.fillStyle = '#c7d2fe';
      ctx.textAlign = 'center';
      ctx.fillText('CHALLENGE: ' + ch.label, W/2, 35);
      ctx.restore();

      // Feedback panel
      if (sceneLocal.feedback) {
        const isOk = sceneLocal.feedback.ok;
        const color = isOk ? '#4ade80' : '#fbbf24';
        ctx.save();
        ctx.shadowBlur = 24;
        ctx.shadowColor = rgba(color, 0.4);
        const bg = ctx.createLinearGradient(0, 60, 0, 180);
        bg.addColorStop(0, 'rgba(28, 32, 48, 0.95)');
        bg.addColorStop(1, 'rgba(14, 18, 30, 0.95)');
        ctx.fillStyle = bg;
        if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(1120, 60, 460, 130, 12); ctx.fill(); }

        ctx.font = '700 13px -apple-system, system-ui';
        ctx.textAlign = 'left';
        ctx.fillText(isOk ? 'NICELY DONE' : 'GENTLE FEEDBACK', 1140, 84);

  isInteractive: true,
  onMouseMove(x, y) {

  },
  onClick(x, y) {

    if (sceneLocal.built.includes(k)) {

    }
  },
  controlsHTML: CHALLENGES.map((c, i) => `<button class="chip${i === 0 ? ' active' : ''}" data-ch="${c.id}">${c.emoji} ${c.label}</button>`).join('') +
    `<button class="chip warm" id="checkChBtn">Check My Pathway</button><button class="chip" id="hintChBtn">Hint</button><button class="chip" id="clearChBtn">Clear</button>`,
  bindControls() {
    const btns = document.querySelectorAll('[data-ch]');
    function setCh(id) {
      sceneLocal.challengeId = id;
      sceneLocal.built = [];
      sceneLocal.feedback = null;
      btns.forEach(x => x.classList.toggle('active', x.getAttribute('data-ch') === id));
    }
    btns.forEach(b => { b.onclick = () => setCh(b.getAttribute('data-ch')); });
    const check = document.getElementById('checkChBtn');
    const hint = document.getElementById('hintChBtn');
    const clearB = document.getElementById('clearChBtn');
    check.onclick = () => {
      const ch = CHALLENGES.find(c => c.id === sceneLocal.challengeId);
      const result = checkPathway(sceneLocal.built, ch.correct);
      sceneLocal.feedback = result;
    };
    hint.onclick = () => {
      const ch = CHALLENGES.find(c => c.id === sceneLocal.challengeId);
      sceneLocal.feedback = { ok: false, msg: ch.hint };
    };
    clearB.onclick = () => { sceneLocal.built = []; sceneLocal.feedback = null; };
  }
};

function checkPathway(built, correct) {
  if (built.length === 0) return { ok: false, msg: 'Start by clicking the sensory input that detects the stimulus.' };
  // Check sensory start
  if (!INPUTS[built[0]] && !REGIONS[built[0]]) {
    // sensor missing
  }
  // exact match
  if (arrEq(built, correct)) {
    const ch = CHALLENGES.find(c => arrEq(c.correct, correct));
    return { ok: true, msg: ch ? ch.success : 'Exactly right.' };
  }
  // Plausibility: starts with a sensory input, ends with an output, includes thalamus for non-smell, etc.
  const startsWithSensor = INPUTS[built[0]];
  const correctSensor = correct[0];
  if (built[0] !== correctSensor) {
    if (built[0] === 'nose' && correctSensor !== 'nose') return { ok: false, msg: 'This stimulus is not a smell. Pick a different sensory input.' };
    if (correctSensor === 'nose') return { ok: false, msg: 'This is a smell. Try starting from the nose. Remember, smell skips the thalamus.' };
    if (correctSensor === 'skin') return { ok: false, msg: 'This is a touch or pain stimulus. Start from the skin.' };
    if (correctSensor === 'ear') return { ok: false, msg: 'This is a sound. Start from the ear.' };
    if (correctSensor === 'eye') return { ok: false, msg: 'This is a visual stimulus. Start from the eye.' };
  }
  // Thalamus check
  if (correct.includes('thalamus') && !built.includes('thalamus')) {
    return { ok: false, msg: 'Most sensory information passes through the thalamus first. Add it before the cortex.' };
  }
  // Amygdala check (fear)
  if (correct.includes('amygdala') && !built.includes('amygdala')) {
    return { ok: false, msg: 'This pathway involves emotion or fear. Try adding the amygdala.' };
  }
  // Hippocampus check (memory)
  if (correct.includes('hippocampus') && !built.includes('hippocampus')) {
    return { ok: false, msg: 'This pathway involves memory. Try adding the hippocampus.' };
  }
  // Accumbens (reward)
  if (correct.includes('accumbens') && !built.includes('accumbens')) {
    return { ok: false, msg: 'Reward pathways involve the nucleus accumbens. Try adding it.' };
  }
  // Cerebellum (movement)
  if (correct.includes('cerebellum') && !built.includes('cerebellum')) {
    return { ok: false, msg: 'Balance and coordination involve the cerebellum. Try adding it.' };
  }
  // Output check
  const outputs = ['muscle','gland','motorNeuron'];
  const lastNeeded = correct[correct.length - 1];
  if (outputs.includes(lastNeeded) && !built.includes(lastNeeded)) {
    return { ok: false, msg: 'This pathway needs an output. Make sure you end with a muscle or gland response.' };
  }
  // length check
  if (built.length < correct.length - 1) {
    return { ok: false, msg: 'Your pathway is missing some steps. Think about what relays and processes the signal.' };
  }
  return { ok: false, msg: 'This is close but not the simplest plausible route. Compare your steps to the canonical pathway and try again.' };
}

function arrEq(a, b) {
  if (a.length !== b.length) return false;
  for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return false;
  return true;
}

const sceneReflect = {
  phase: 'Step 13: Reflect & Synthesize',
  phaseColor: '#c7d2fe',
  notes: "Look back at your tracker table. You traced pathways for <strong>touch, pain, hearing, smell, vision, reward, addiction, and movement</strong>. Every one followed the same overall shape but emphasized different brain regions. The brain is not one piece doing one thing — it is many regions working in <strong>parallel</strong>, and the pathway depends on the sensory modality and the kind of response needed. <strong>Each region has a specialty. They work together.</strong>",

// ============================================================================
// UI WIRING
// ============================================================================

const phaseNameEl = document.getElementById('phaseName');
const notesEl = document.getElementById('notes');
const stepHeadingEl = document.getElementById('stepHeading');
const notebookTextEl = document.getElementById('notebookText');
const stepIndicator = document.getElementById('stepIndicator');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const resetBtn = document.getElementById('resetBtn');
const simControlsEl = document.getElementById('simControls');
const pathwayKeyEl = document.getElementById('pathwayKey');

function pad2(n) { return n < 10 ? '0' + n : '' + n; }

// Next button is gated by the scene's canAdvance() if defined.
// Scenes with internal sub-phases (e.g. the intro) use this to hold
// the student until they've stepped through every sub-phase.
function refreshNextButton() {
  if (currentSceneIdx === scenes.length - 1) {
    nextBtn.disabled = true;
    nextBtn.title = '';
    return;
  }
  const s = scenes[currentSceneIdx];
  if (s.canAdvance && !s.canAdvance()) {
    nextBtn.disabled = true;
    nextBtn.title = 'Finish the sub-phases in this step before moving on';
  } else {
    nextBtn.disabled = false;
    nextBtn.title = '';
  }
}

function setScene(i) {
  currentSceneIdx = i;
  animT = 0;
  sceneFadeT = 0;
  const s = scenes[i];
  if (s.setup) s.setup();
  phaseNameEl.textContent = s.phase;
  phaseNameEl.style.color = s.phaseColor;
  notesEl.innerHTML = s.notes;
  stepHeadingEl.textContent = s.phase;
  notebookTextEl.innerHTML = s.notebook;
  stepIndicator.textContent = `${pad2(i + 1)} / ${pad2(scenes.length)}`;
  prevBtn.disabled = i === 0;
  nextBtn.textContent = i === scenes.length - 1 ? 'Done' : 'Next →';
  refreshNextButton();

  // Pathway key reveal (controlled per scene or by Scenario Lab)
  if (s.pathwayKey) {
    pathwayKeyEl.innerHTML = '<strong>Pathway:</strong> ' + s.pathwayKey;
    pathwayKeyEl.classList.remove('hidden');
  } else {
    pathwayKeyEl.classList.add('hidden');
  }

  // Sim controls
  simControlsEl.innerHTML = '';
  if (s.controlsHTML) {
    simControlsEl.innerHTML = s.controlsHTML;
    simControlsEl.classList.add('visible');
    if (s.bindControls) s.bindControls();
  } else {
    simControlsEl.classList.remove('visible');
  }

  // Cursor for interactive scenes
  if (s.onMouseMove || s.onClick) canvas.classList.add('interactive');
  else canvas.classList.remove('interactive');
}

prevBtn.addEventListener('click', () => { if (currentSceneIdx > 0) setScene(currentSceneIdx - 1); });
nextBtn.addEventListener('click', () => { if (currentSceneIdx < scenes.length - 1) setScene(currentSceneIdx + 1); });
resetBtn.addEventListener('click', () => setScene(0));
document.addEventListener('keydown', (e) => {
  if (e.target && e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'ArrowRight' && currentSceneIdx < scenes.length - 1 && !nextBtn.disabled) setScene(currentSceneIdx + 1);
  if (e.key === 'ArrowLeft' && currentSceneIdx > 0) setScene(currentSceneIdx - 1);
});

// ============================================================================
// MAIN LOOP
// ============================================================================

let lastTs = null;
function tick(ts) {
  if (lastTs == null) lastTs = ts;
  const dt = Math.min(50, ts - lastTs);
  lastTs = ts;
  animT += dt;
  sceneFadeT = Math.min(1, sceneFadeT + dt / 600);
  const s = scenes[currentSceneIdx];
  if (s.update) s.update(dt);
  ctx.save();
  ctx.fillStyle = '#0a0a0a';
  ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = sceneFadeT;
  s.draw(ctx, animT);
  ctx.restore();
  requestAnimationFrame(tick);
}

setScene(0);
requestAnimationFrame(tick);
